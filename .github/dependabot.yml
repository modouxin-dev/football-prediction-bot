version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # PTB 22.8 要求 httpx<0.29,>=0.27。越界会让 pip 依赖解析失败，
      # CI 在装依赖阶段就报红（test 仅 9 秒失败，pytest 从未启动）。
      # 如需升到 0.29+，必须先升级 python-telegram-bot。
      - dependency-name: "httpx"
        versions: [">=0.29.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
