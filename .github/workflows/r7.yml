name: r7
on:
  push:
    branches: [tmp-r2]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.10"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f > /dev/null 2>&1 || true
      - run: |
          OUT=$RUNNER_TEMP/o.txt
          : > $OUT
          echo "fc-list CJK: $(fc-list | grep -ci 'noto.*cjk')" >> $OUT
          echo "--- 全量（含探针）---" >> $OUT
          python -m pytest -q --tb=line -rf -s 2>&1 | grep -E "PROBE-RUN|passed|failed|FAILED" >> $OUT
          echo "--- 再单独跑 test_chart ---" >> $OUT
          python -m pytest tests/test_chart.py -q --tb=line 2>&1 | tail -3 >> $OUT
          B64=$(base64 -w0 $OUT)
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/r7out.txt" \
            -d "{\"message\":\"r7\",\"content\":\"$B64\",\"branch\":\"tmp-r2-out\"}" > /dev/null
