name: r2
on:
  push:
    branches: [tmp-r2]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.10"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: |
          OUT=$RUNNER_TEMP/o.txt
          : > $OUT
          python -m pytest -q --tb=short -rf 2>&1 | tail -45 >> $OUT
          B64=$(base64 -w0 $OUT)
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/r2out.txt" \
            -d "{\"message\":\"r2\",\"content\":\"$B64\",\"branch\":\"tmp-r2-out\"}" > /dev/null
