name: probehealth
on:
  push:
    branches: [probe/health-ver]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          OUT=$RUNNER_TEMP/o.txt
          : > $OUT
          echo "=== /health ===" >> $OUT
          curl -s -m 30 "https://football-prediction-bot-production-fb03.up.railway.app/health" >> $OUT
          echo >> $OUT
          echo "=== /health/model ===" >> $OUT
          curl -s -m 30 "https://football-prediction-bot-production-fb03.up.railway.app/health/model" | head -c 300 >> $OUT
          echo >> $OUT
          B64=$(base64 -w0 $OUT)
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/probeout.txt" \
            -d "{\"message\":\"out\",\"content\":\"$B64\",\"branch\":\"probe/health-ver-out\"}" > /dev/null
