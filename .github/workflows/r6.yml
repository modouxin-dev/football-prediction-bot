name: r6
on:
  push:
    branches: [tmp-r2]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.10"}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f > /dev/null 2>&1 || true
      - run: |
          OUT=$RUNNER_TEMP/o.txt
          : > $OUT
          echo "=== 1) 裸环境字体诊断 ===" >> $OUT
          python -c "
          import matplotlib; matplotlib.use('Agg')
          import matplotlib.font_manager as fm
          tl=fm.fontManager.ttflist
          print('ttflist len:', len(tl))
          print('has Noto Sans CJK:', any('Noto Sans CJK' in f.name for f in tl))
          import matplotlib as m; print('MPLCONFIGDIR:', m.get_cachedir())
          " >> $OUT 2>&1
          echo "=== 2) 全量跑 + 在 chart 测试点打印 ===" >> $OUT
          cat > /tmp/diag_conftest.py <<'EOF'
import matplotlib.font_manager as fm
def _probe():
    tl = fm.fontManager.ttflist
    print(f"[PROBE] ttflist={len(tl)} hasNotoCJK={any('Noto Sans CJK' in f.name for f in tl)}")
_probe()
EOF
          cp /tmp/diag_conftest.py ./diag_probe_mod.py
          python -m pytest -q --tb=line -rf 2>&1 | grep -E "PROBE|passed|failed|FAILED" | tail -6 >> $OUT
          echo "=== 3) 全量后立即再诊断 ===" >> $OUT
          python -c "
          import matplotlib; matplotlib.use('Agg')
          import matplotlib.font_manager as fm
          tl=fm.fontManager.ttflist
          print('ttflist len:', len(tl))
          print('has Noto Sans CJK:', any('Noto Sans CJK' in f.name for f in tl))
          " >> $OUT 2>&1
          B64=$(base64 -w0 $OUT)
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/r6out.txt" \
            -d "{\"message\":\"r6\",\"content\":\"$B64\",\"branch\":\"tmp-r2-out\"}" > /dev/null
