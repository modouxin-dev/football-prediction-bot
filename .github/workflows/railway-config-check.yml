name: Railway Config Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-config:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Run Railway Config Validator
        id: validate
        run: python scripts/validate_railway_config.py

      - name: Report Results
        if: always()
        # 原写法是 `echo "✅..." || echo "❌..."`：echo 永远成功，所以无论
        # 上一步是红是绿这里都打印 ✅，容易误判成"检测已通过"。
        # 改为按上一步真实结果分支输出。
        run: |
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            echo "✅ 配置检测通过"
          else
            echo "❌ 配置检测失败，请查看上方日志中的 ❌ 条目"
          fi