name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 与 Pages 部署（group: "pages"）分开，避免互相抢占导致其中一个被取消。
# 同一分支的新推送会取消上一次未跑完的测试，省 CI 时长。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 3.10 是本机开发常用版本，3.12 与 Dockerfile 保持一致；
    # fail-fast: false 让两个版本都跑完，任一失败都能看到。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PY_VER: ${{ matrix.python-version }}
        # pytest.ini 已配置 pythonpath = . 与 testpaths = tests
        # 测试不联网，使用 tests/sample_data.py 的仿真响应
        #
        # 失败时把 FAILED/ERROR 行写进 job summary：Actions 的日志 zip 需要
        # 单独下载（且部分网络环境取不到），摘要则能直接在页面上看到，
        # 不必为了「哪个用例挂了」去翻几十秒的日志。
        run: |
          set -o pipefail
          python -m pytest -q --tb=line -rf > /tmp/pytest.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "### ❌ pytest 失败（退出码 $code）" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(FAILED|ERROR)" /tmp/pytest.txt >> "$GITHUB_STEP_SUMMARY" \
              || tail -40 /tmp/pytest.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # ::error:: 注解会进 check-run 的 annotations，API 可读，
            # 不必下载日志 zip（部分网络环境取不到）。
            grep -E "^(FAILED|ERROR)" /tmp/pytest.txt | head -10 | while read -r line; do
              echo "::error::$line"
            done
            # 日志 zip / artifact 都走 results-receiver 域名（网络策略 403）。
            # 这里把完整输出写进 ci-debug 分支的文件——contents API 走
            # api.github.com，可被外部直接读取，用于定位失败用例。
            python - <<'PYEOF'
import base64, json, os, urllib.request
API = "https://api.github.com/repos/modouxin-dev/football-prediction-bot"
TOK = os.environ["GITHUB_TOKEN"]
H = {"Authorization": "Bearer " + TOK, "Accept": "application/vnd.github+json",
     "Content-Type": "application/json", "User-Agent": "ci"}


def api(path, method="GET", data=None):
    req = urllib.request.Request(
        API + path, data=json.dumps(data).encode() if data else None,
        method=method, headers=H)
    try:
        return json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
    except Exception as exc:
        print("  api %s %s -> %s" % (method, path, exc))
        return {}


txt = open('/tmp/pytest.txt', encoding='utf-8', errors='replace').read()
name = "pytest-py%s.txt" % os.environ.get("PY_VER", "x")
branch = "ci-debug"

ref = api("/git/ref/heads/main")
sha = (ref.get("object") or {}).get("sha")
if sha:
    api("/git/refs", "POST", {"ref": "refs/heads/" + branch, "sha": sha})
res = api("/contents/" + name, "PUT", {
    "message": "ci: dump failing pytest output (%s)" % name,
    "content": base64.b64encode(txt.encode()).decode(),
    "branch": branch})
print("写文件结果:", (res.get("content") or {}).get("path") or res.get("message") or "?")
PYEOF
          fi
          tail -60 /tmp/pytest.txt
          exit $code

      - name: Upload pytest output on failure
        # 日志 zip 需要从 results-receiver 域名下载（部分网络环境 403），
        # artifact 走 api.github.com 域名，可正常下载，用于定位失败用例。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-py${{ matrix.python-version }}
          path: /tmp/pytest.txt
          if-no-files-found: ignore

      - name: Static check (undefined name)
        # 独立步骤而非塞进 pytest：这类问题（NameError）此前靠测试完全拦不住
        # —— 两个 P0 的 undefined name 在 883 条用例下活到了 main，因为对应
        # 路径零覆盖。静态检查能一次性杜绝整类问题，且失败时报错清晰。
        run: |
          python -m pyflakes *.py commands/*.py views/*.py > /tmp/pyflakes.txt || true
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            echo "::error::发现未定义名称（NameError 隐患）："
            grep "undefined name" /tmp/pyflakes.txt
            exit 1
          fi
          echo "静态检查通过：无 undefined name"

      - name: Smoke check (config + import)
        # 冒烟：配置加载与模块导入必须成功，否则部署后必崩。
        # 用假 token，只验证启动前置路径，不连接 Telegram。
        env:
          TELEGRAM_TOKEN: "1:fake-token-for-ci"
          RAPID_API_KEY: "fake-key-for-ci"
          DATA_DIR: "/tmp/ci-smoke"
        run: |
          python - <<'PY'
          import main, paths, config
          s = config.load_settings()
          assert s.db_path, "db_path 不能为空"
          print("smoke ok: db_path =", s.db_path)
          PY