name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 与 Pages 部署（group: "pages"）分开，避免互相抢占导致其中一个被取消。
# 同一分支的新推送会取消上一次未跑完的测试，省 CI 时长。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 显式声明 permissions 会把未列出的 scope 全部置为 none，checks 变 none 后
  # 步骤里的 ::error:: 就写不进 check-run 注解（外部只能看到「exit code 1」，
  # 拿不到具体用例）。这里放开 checks 以便把失败输出回传出来。
  checks: write

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 3.10 是本机开发常用版本，3.12 与 Dockerfile 保持一致；
    # fail-fast: false 让两个版本都跑完，任一失败都能看到。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # 仓库有三个依赖文件，只监视 dev 时另两个变更不会刷新缓存键，
          # 会命中旧缓存导致新声明的依赖根本没装——表现同样是 INTERNALERROR。
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-web.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install CJK fonts (chart tests require them)
        # chart.py 的 _setup_font() 需要中文字体，找不到时 FONT_IN_USE 为空串，
        # tests/test_chart.py:126 会断言失败，渲染时还会刷屏
        # "Glyph xxxxx missing from current font"。
        # Dockerfile 已在 PR #36 加了 CJK 字体支持，CI 必须保持一致。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f > /dev/null 2>&1 || true

      - name: Verify dependencies installed
        # 依赖缺失若不在这一步拦住，会以 pytest INTERNALERROR / api.py SystemExit
        # 的形式暴露，根因埋在堆栈中段，排查要翻好几屏。
        # 此步骤把失败信号前移成「缺哪个包」一句话。
        run: |
          python - <<'PY'
          import importlib
          import sys
          from typing import Final

          # 关键依赖清单：(导入名, 声明所在文件)。新增门禁依赖时同步追加。
          REQUIRED: Final[tuple[tuple[str, str], ...]] = (
              ("pytest", "requirements-dev.txt"),
              ("pytest_asyncio", "requirements-dev.txt"),
              ("telegram", "requirements.txt"),
              ("apscheduler", "requirements.txt (job-queue extra)"),
              ("fastapi", "requirements-dev.txt"),
              ("uvicorn", "requirements-dev.txt"),
          )

          def verify() -> list[str]:
              """逐个导入关键依赖，返回缺失项描述。空列表表示全部就绪。"""
              missing: list[str] = []
              for module, source in REQUIRED:
                  try:
                      importlib.import_module(module)
                  except ImportError:
                      missing.append(f"{module} (声明于 {source})")
              return missing

          gaps = verify()
          if gaps:
              print("::error::关键依赖未安装，后续 pytest 将以 INTERNALERROR 崩溃：")
              for g in gaps:
                  print(f"::error::  - {g}")
              sys.exit(1)
          print("依赖校验通过：关键包全部就绪")
          PY

      - name: Run tests
        # pytest.ini 已配置 pythonpath = . 与 testpaths = tests
        # 测试不联网，使用 tests/sample_data.py 的仿真响应
        run: |
          set -o pipefail
          # 两个坑，改回任一个都会让失败详情再次消失：
          # 1) 本步骤 shell 是 `bash -e`，pytest 一返回非零就当场中止脚本，
          #    下面所有回传逻辑永远不执行——只能看到「exit code 1」。
          #    所以这里临时关掉 -e，拿到退出码后再恢复。
          # 2) 不能把 pytest 输出重定向进文件，否则 job 日志里只剩脚本回声。
          #    用 tee 让输出实时打到日志上，手机端展开即可看到。
          set +e
          python -m pytest -q --tb=line -rf --strict-markers 2>&1 | tee /tmp/pytest.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "### ❌ pytest 失败（退出码 $code）" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 /tmp/pytest.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # 每步注解上限 10 条，GitHub 自动生成的已占 3 条；写多了会被整体
            # 丢弃（此前写 40 条，外部一条都看不到）。这里只发 5 条。
            grep -E "^(FAILED|ERROR)" /tmp/pytest.txt | head -5 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-py${{ matrix.python-version }}
          path: /tmp/pytest.txt
          if-no-files-found: warn

      - name: Static check (undefined name)
        # 独立步骤而非塞进 pytest：这类问题（NameError）此前靠测试完全拦不住
        # —— 两个 P0 的 undefined name 在 883 条用例下活到了 main，因为对应
        # 路径零覆盖。静态检查能一次性杜绝整类问题，且失败时报错清晰。
        run: |
          python -m pyflakes *.py commands/*.py views/*.py > /tmp/pyflakes.txt || true
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            echo "::error::发现未定义名称（NameError 隐患）："
            grep "undefined name" /tmp/pyflakes.txt
            exit 1
          fi
          echo "静态检查通过：无 undefined name"

      - name: Smoke check (config + import)
        # 冒烟：配置加载与模块导入必须成功，否则部署后必崩。
        # 用假 token，只验证启动前置路径，不连接 Telegram。
        env:
          TELEGRAM_TOKEN: "1:fake-token-for-ci"
          RAPID_API_KEY: "fake-key-for-ci"
          DATA_DIR: "/tmp/ci-smoke"
        run: |
          python - <<'PY'
          import main, paths, config
          s = config.load_settings()
          assert s.db_path, "db_path 不能为空"
          print("smoke ok: db_path =", s.db_path)
          PY

  readme-sync:
    name: README 同步提醒
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 源码变更时检查 README 是否同步
        # 提醒而非阻断：纯内部重构可能确实无需改文档，强制失败会拖慢开发。
        # 目的是让"改了功能却忘了同步文档"在 PR 里显式暴露出来。
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)"
          CODE="$(printf '%s\n' "$CHANGED" | grep -E '\.(py|sh|yml)$|Dockerfile' | grep -v '^tests/' || true)"
          if [ -n "$CODE" ] && ! printf '%s\n' "$CHANGED" | grep -qx 'README.md'; then
            echo "::warning::改动涉及源码/部署配置但未更新 README.md —— 命令、环境变量、端点、口径变化都应同步到文档。改动文件："
            printf '%s\n' "$CODE"
            echo "::notice::若确为无需改文档的内部重构，可忽略本提醒。"
          else
            echo "README 同步检查通过"
          fi
