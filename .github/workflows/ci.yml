name: CI

on:
  push:
    branches: [ci-debug]

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q --tb=line -rf > /tmp/pytest.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            BODY=$(jq -Rs . /tmp/pytest.txt)
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/modouxin-dev/football-prediction-bot/issues" \
              -d "{\"title\":\"CI 失败 py${{ matrix.python-version }} run${{ github.run_id }}\",\"body\":$BODY}"
          fi
          tail -60 /tmp/pytest.txt
          exit $code
