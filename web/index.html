<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>足球预测看板</title>
<style>
  :root{
    /* 字重整体上调：原 400/600 在深色底上发虚，尤其队名这类关键信息。
       只改字重与颜色，不改字号——移动端横向空间本来就紧。 */
    --fw-normal: 500;
    --fw-strong: 700;
    --bg:#0f1115; --card:#171a21; --line:#252a34; --text:#eef2f8;
    --dim:#9aa3b2; --accent:#4da3ff; --good:#3ddc97; --bad:#ff6b6b;
    --warn:#ffc857;
  }
  *{box-sizing:border-box}
  body{
    font-weight: var(--fw-normal);
    color: var(--text);
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; padding:16px; max-width:960px; margin:0 auto;
  }
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:19px;margin:0;flex:1}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--good);border-color:#245c44}
  .pill.bad{color:var(--bad);border-color:#5c2b2b}
  button{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;
  }
  button:active{opacity:.7}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 span{font-size:11px;color:var(--dim);font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .stat{background:#12151b;border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat i{font-style:normal;font-size:12px;color:var(--dim)}
  .empty{color:var(--dim);font-size:13px;padding:8px 0}
  .note{background:#1d2230;border-left:3px solid var(--warn);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:#cfd6e4;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .hit{color:var(--good)} .miss{color:var(--bad)}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .bar{height:8px;border-radius:4px;background:#222833;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .lv{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .lv>i{font-style:normal;width:52px;color:var(--dim)}
  .lv>.bar{flex:1}
  .lv>b{width:96px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:14px 0 4px}
  .err{color:var(--bad);font-size:13px}
  .debug{background:#1d1f26;border:1px dashed var(--line);padding:12px;border-radius:8px;font-family:monospace;font-size:12px;color:var(--dim);margin-bottom:14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
  .debug-btn{font-size:12px;padding:4px 8px;margin-top:8px;background:var(--accent);color:#000;border:none;cursor:pointer;border-radius:4px}
  .debug-btn:hover{opacity:.8}

  /* ===== 美化覆盖 ===== */
  body{background:radial-gradient(1200px 600px at 50% -200px,#1b2536,var(--bg)) fixed}
  h1{font-size:20px;font-weight:700;letter-spacing:.3px}
  .card{box-shadow:0 6px 24px rgba(0,0,0,.25);transition:border-color .15s}
  .card:hover{border-color:#334056}
  .card h2{font-size:16px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .stat{background:linear-gradient(160deg,#1a2030,#12151b);text-align:center}
  /* 决策链：四阶段纵向排列，阶段间用细线分隔 */
  .trace{margin-top:2px}
  .trow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
        border-bottom:1px solid var(--line);font-size:13px}
  .trow:last-child{border-bottom:0}
  .tkey{color:#9fb4d0;font-weight:600;white-space:nowrap}
  .tval{color:#cfe0f5;text-align:right;font-variant-numeric:tabular-nums}
  .tnote{font-size:12px;color:#7f93ad;padding:2px 0 4px}
  .tdelta{font-size:11px;color:#5f7a96}
  .tfeat{font-size:12px;color:#8fa3bd;padding:4px 0;line-height:1.5}
  .badText{color:#ff8a9b}
  /* 超期未结算：与「正常指标」区分开，避免被当成又一个蓝数字 */
  .stat.bad{background:linear-gradient(160deg,#3a1f26,#241318);border:1px solid #7a3b47}
  .stat.bad b{color:#ff8a9b}
  .stat b{font-size:26px;color:var(--accent)}
  table{display:block;overflow-x:auto;white-space:nowrap}
  td,th{padding:9px 8px}
  tbody tr:nth-child(even){background:#14171e}
  tbody tr:hover{background:#1c2230}
  button{transition:background .15s}
  button:hover{background:#1f2430}
  .pill{font-weight:600}
  footer{margin-top:10px}

  /* ===== 赛程卡片：每场一张，含队伍近况 ===== */
  .rbtns{display:flex;gap:6px;margin-bottom:6px}
  .rbtn{font-size:12px;padding:4px 12px;border-radius:999px}
  .rbtn.on{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
  .lg{margin-top:12px}
  .lgh{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px}
  .lgh b{font-size:14px}
  .lgh span{font-size:12px;color:var(--dim)}
  .dsep{font-size:12px;color:var(--dim);margin:10px 0 4px;padding-left:2px}
  .match{background:#12151b;border:1px solid var(--line);border-left:3px solid var(--accent);
         border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .mhead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:6px}
  .mhead .md{font-size:13px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .mhead .sc{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;margin-left:auto}
  .mhead .st{margin-left:auto}
  .pill2{font-size:11px;padding:1px 7px;border-radius:999px;background:#1d2430;color:var(--dim)}
  .team{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
  .team .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team .tm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .team .tm b{color:var(--accent);font-weight:600}
  .team .tm i{font-style:normal}
  .form{display:inline-flex;gap:3px;flex:0 0 auto}
  .form i{font-style:normal;width:18px;height:18px;line-height:18px;text-align:center;
          border-radius:4px;font-size:11px;color:#0b0e13;font-weight:700}
  .form i.w{background:var(--good)} .form i.d{background:#8b96a8} .form i.l{background:var(--bad)}
  .form.empty{font-size:11px;color:var(--dim)}
  .pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#222833;margin:8px 0 4px}
  .pbar i{display:block;height:100%}
  .pbar i.h{background:var(--accent)} .pbar i.d{background:#6b7587} .pbar i.a{background:var(--warn)}
  .plegend{display:flex;gap:10px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .plegend b{margin-left:auto;color:var(--text)}
  .fnote{font-size:12px;color:var(--dim);margin-top:10px}

  /* ===== 分区导航 ===== */
  .secnav{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;
          padding:8px 0;margin:0 0 4px;background:#0f1115;border-bottom:1px solid var(--line);
          -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .secnav::-webkit-scrollbar{display:none}
  .secnav button{flex:0 0 auto;font-size:12.5px;padding:5px 13px;border-radius:999px;color:var(--dim)}
  .secnav button.on{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}

  /* ===== 分区 ===== */
  .sec{scroll-margin-top:52px;margin-bottom:24px}
  .sechd{display:flex;align-items:center;gap:9px;margin:0 0 10px;padding-left:2px}
  .sechd::before{content:'';flex:0 0 auto;width:3px;height:15px;border-radius:2px;background:var(--accent)}
  .sechd b{font-size:14.5px;letter-spacing:.2px}
  .sechd span{font-size:11.5px;color:var(--dim);margin-left:auto;text-align:right}
  .secbody{display:flex;flex-direction:column;gap:12px}
  .secbody .card{margin-bottom:0}
  .cols{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
  @media(min-width:900px){
    .cols{grid-template-columns:1fr 1fr}
    .cols-3{grid-template-columns:1fr 1fr}
  }
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tblwrap>table{min-width:680px}

  /* ===== 移动端适配：消除表格横向溢出 ===== */
  @media(max-width:680px){
    body{padding:12px;font-size:14px}
    .card{padding:13px;border-radius:14px}
    .grid{grid-template-columns:1fr 1fr;gap:8px}
    .stat{padding:10px 8px}
    .stat b{font-size:21px}
    .stat i{font-size:11px}
    table{white-space:normal}
    .tblwrap>table{min-width:0;width:100%}
    th,td{padding:8px 5px;font-size:12px}
    /* 回测表在手机上保留：时间 / 场次 / 方向命中 / 比分命中 / 判定。
       其余列收起——10 列铺在 375px 上必然溢出，表头被切成「库内/」。 */
    .tbl-bt th:nth-child(2),.tbl-bt td:nth-child(2),
    .tbl-bt th:nth-child(6),.tbl-bt td:nth-child(6),
    .tbl-bt th:nth-child(7),.tbl-bt td:nth-child(7),
    .tbl-bt th:nth-child(8),.tbl-bt td:nth-child(8),
    .tbl-bt th:nth-child(9),.tbl-bt td:nth-child(9){display:none}
    /* 强度榜：收起「场次」 */
    .tbl-st th:nth-child(3),.tbl-st td:nth-child(3){display:none}

    /* 赛程卡片队伍行：改两行布局。
       实测 375px 视口下 match 内容区仅 301px，而单行需要 356px
       （队名 89 + nowrap 的数据串 165 + 近况色块 102），
       队名被压缩到 34px 后只剩 ellipsis 的「C…」——等于看不见队名。
       队名独占一行，数据串与色块共享第二行，两者都可截断。 */
    .team{flex-wrap:wrap;gap:2px 8px;padding:4px 0}
    .team .tn{flex:1 1 100%;order:1}
    .team .tm{flex:1 1 auto;order:2;min-width:0;overflow:hidden;
              text-overflow:ellipsis}
    .team .form{order:3;margin-left:auto}
    /* 数据串里战绩部分优先级低于排名与实力分：空间不足先牺牲它 */
    .team .tm i{font-size:11px}
  }

  /* ===== 审计：宽屏表格 / 窄屏卡片流 ===== */
  .audit-list{display:none}
  @media(max-width:680px){
    .audit-tbl{display:none}
    .audit-list{display:block}
  }
  .arow{background:#12151b;border:1px solid var(--line);border-left:3px solid var(--accent);
        border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .arow .at{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
  .arow .at .sc{margin-left:auto;font-size:14px;font-variant-numeric:tabular-nums}
  .arow .am{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--dim);margin-top:6px}
  .arow .am .tag{font-size:11px;padding:1px 8px;border-radius:999px;background:#1d2430;color:var(--dim)}
  .arow .am .tag.ok{color:var(--good);background:#14301d}
  .arow .am .tag.no{color:var(--bad);background:#331616}
  .arow .am .dt{margin-left:auto}

  /* ===== 空态说明：让「为什么没有」可见 ===== */
  .why{background:#1d2230;border-left:3px solid var(--accent);padding:8px 11px;
       border-radius:0 8px 8px 0;font-size:12px;color:var(--dim);margin-top:8px}

  /* ===== 任务状态 ===== */
  .jb{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;
      border-radius:4px;font-size:11px;font-weight:700;color:#0b0e13;margin-right:4px}
  .jb.jok{background:var(--good)} .jb.jfail{background:var(--bad)}
  .jb.jskip{background:#8b96a8} .jb.junknown{background:#4a5464}
  td.jmsg{font-size:11.5px;color:var(--dim);white-space:normal;min-width:120px}
  @media(max-width:680px){
    .tbl-jobs th:nth-child(2),.tbl-jobs td:nth-child(2){display:none}
  }
  /* 额度表：份额列可以让位，次数列不行 */
  .tbl-quota td:nth-child(3){width:38%}
  .qbar{display:block;height:7px;background:#1b2029;border-radius:4px;overflow:hidden}
  .qbar>span{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:4px}
  @media(max-width:680px){
    .tbl-quota th:nth-child(4),.tbl-quota td:nth-child(4){display:none}
  }


  /* ===== 今日赛程：折叠 + 精简行 ===== */
  .lgh{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
       padding:9px 10px;background:#12151b;border:1px solid var(--line);border-radius:10px;margin:10px 0 0}
  .lgh b{font-size:14px}
  .lgh span{font-size:12px;color:var(--dim);margin-left:auto}
  .lgh .lgtoggle{font-size:11.5px;padding:2px 10px;border-radius:999px;flex:0 0 auto}
  .lgh.open{border-left:3px solid var(--accent);background:#151b26}
  .lgbody{padding-top:8px}
  /* 一行一场：时间 | 主 vs 客 | 预测按钮。队名可换行但绝不截断——
     「看不懂是哪支队」比「行高一点」严重得多。 */
  .mrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .mrow .mtime{flex:0 0 auto;font-size:12.5px;color:var(--dim);
               font-variant-numeric:tabular-nums;min-width:42px}
  .mrow .mvs{flex:1;min-width:0;font-size:13.5px;display:flex;flex-wrap:wrap;
             align-items:baseline;gap:6px;word-break:break-word}
  .mrow .mvs b{font-weight:var(--fw-strong);color:#fff;letter-spacing:.2px}
  .mrow .mvs i{font-style:normal;font-size:11px;color:var(--dim)}
  .pbtn{flex:0 0 auto;font-size:12px;padding:4px 12px;border-radius:999px}
  .pbtn.off{cursor:default;opacity:.55;font-size:11px;padding:4px 9px}
  @media(max-width:680px){
    .mrow{gap:8px;padding:8px 2px}
    .mrow .mvs{font-size:13px}
    .pbtn{padding:4px 10px}
  }

  /* 数据滞后提示：用了过期缓存时必须说，不能让旧快照冒充实时 */
  .warn{color:#e0a03a;font-weight:600}
  /* 联赛徽标：用「旗帜 + 短名」字符徽标，不用外链图片。
     库里没有存 logo URL，外链要额外请求且随时可能失效；
     旗帜是纯字符，零成本、零失效，深色底上一眼可辨。 */
  .lgh .lgemblem{display:inline-flex;align-items:center;justify-content:center;
       width:26px;height:26px;border-radius:7px;background:#1d2431;
       border:1px solid var(--line);font-size:15px;flex:0 0 auto;line-height:1}
  .lgh .lgname{font-weight:var(--fw-strong);color:#fff;font-size:14px}
  .lgh .lgshort{font-size:11px;color:var(--dim);font-weight:600}
  /* 队名过长时自动竖排：横排挤在一起会截断成「Coritiba F…」，
     比多占两行严重得多。由 JS 按实际长度决定是否加 .stack。 */
  .mrow .mvs.stack{flex-direction:column;align-items:flex-start;gap:2px}
  .mrow .mvs.stack i{margin:0}
  .mrow .mvs.stack b{line-height:1.35}

  /* ===== 预测详情弹窗 ===== */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;
         justify-content:center;background:rgba(0,0,0,.6)}
  .mbox{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;
        width:100%;max-width:560px;max-height:86vh;overflow-y:auto;padding:16px;
        -webkit-overflow-scrolling:touch}
  .mhd{display:flex;align-items:center;gap:10px;position:sticky;top:-16px;
       background:var(--card);padding:0 0 12px;margin:-16px -16px 0;
       padding:14px 16px 12px;border-bottom:1px solid var(--line);z-index:2}
  .mhd b{flex:1;font-size:15px}
  .mteams{font-size:16px;font-weight:600;text-align:center;margin:14px 0 4px;word-break:break-word}
  .mteams i{font-style:normal;color:var(--dim);font-size:12px;margin:0 8px}
  .mteams.stack{display:flex;flex-direction:column;align-items:center;gap:3px}
  .mteams.stack i{margin:0}
  .mteams b{font-weight:var(--fw-strong);color:#fff}
  .mgrid b{font-weight:var(--fw-strong)}
  .msec h4{color:#b9c3d4}
  .mmeta{font-size:11.5px;color:var(--dim);text-align:center;margin-bottom:14px}
  .msec{margin-bottom:16px}
  .msec h4{font-size:12.5px;color:var(--dim);font-weight:600;margin:0 0 8px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
  .mgrid>div{background:#12151b;border:1px solid var(--line);border-radius:9px;padding:8px 9px}
  .mgrid i{font-style:normal;display:block;font-size:11px;color:var(--dim)}
  .mgrid b{font-size:13.5px;font-variant-numeric:tabular-nums}
  .mtop{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.6}
  .msec .lxi{background:#12151b;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
  /* 实时板块队名竖排：与今日赛程同一规则，横排放不下就竖排 */
  .lteams.stack{flex-direction:column;align-items:flex-start;gap:4px}
  .lteams.stack .ltn.ra{text-align:left}
  .mfoot{font-size:11px;color:var(--dim);text-align:center;padding-top:6px;border-top:1px solid var(--line)}
  @media(min-width:700px){
    .modal{align-items:center}
    .mbox{border-radius:16px;max-height:80vh}
  }

  /* ===== 正在进行 ===== */
  .livemeta{font-size:12px;color:var(--dim);margin-bottom:10px}
  .livem{background:#12151b;border:1px solid var(--line);border-left:3px solid var(--bad);
         border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .lhead{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);margin-bottom:7px}
  .lhead .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:0 0 auto;
              animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .lhead .lgname{color:var(--text);font-weight:600}
  .lhead .lst{margin-left:auto}
  /* 队伍行：队名可截断，比分永远完整居中——比分是这一屏唯一必须看清的数字 */
  .lteams{display:flex;align-items:center;gap:10px;font-size:14px}
  .lteams .ltn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lteams .ltn.ra{text-align:right}
  .livescore{font-size:20px;font-variant-numeric:tabular-nums;color:var(--text);flex:0 0 auto;min-width:52px;text-align:center}
  .lrow{display:flex;gap:8px;font-size:12px;margin-top:7px;align-items:flex-start}
  .lrow>i{font-style:normal;color:var(--dim);flex:0 0 30px;padding-top:1px}
  .lrow>span,.lrow>.lcol{flex:1;min-width:0;color:#cfd6e4;word-break:break-word}
  .lrow .dim{color:var(--dim)}
  .lrow .bad{color:var(--warn)}
  .lcol{display:flex;flex-direction:column;gap:4px}
  .lxi{display:flex;flex-direction:column;gap:2px}
  .lxi>b{font-size:11.5px;color:var(--text);font-weight:600}
  .lxi>span{font-size:11.5px;color:var(--dim);line-height:1.55}
  @media(max-width:680px){
    .lteams{font-size:13px;gap:8px}
    .livescore{font-size:18px;min-width:46px}
    /* 首发 11 人全列在窄屏会占半屏，先只显示阵型与人数 */
    .lxi>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  }
</style>
</head>
<body>

<header>
  <h1>⚽ 足球预测看板</h1>
  <span class="pill" id="ver">—</span>
  <span class="pill" id="health">加载中…</span>
  <button onclick="load()">刷新</button>
  <button onclick="toggleDebug()">诊断</button>
</header>

<nav class="secnav" id="secnav">
  <button data-sec="sec-live" onclick="goSec('sec-live')">🔴 正在进行</button>
  <button data-sec="sec-fix" onclick="goSec('sec-fix')">📅 赛程</button>
  <button data-sec="sec-model" onclick="goSec('sec-model')">📈 模型表现</button>
  <button data-sec="sec-bt" onclick="goSec('sec-bt')">🧪 历史回测</button>
  <button data-sec="sec-audit" onclick="goSec('sec-audit')">🔍 预测审计</button>
  <button data-sec="sec-team" onclick="goSec('sec-team')">🏆 球队强度</button>
  <button data-sec="sec-jobs" onclick="goSec('sec-jobs')">⚙️ 任务状态</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"></div>

<div id="debug-panel" style="display:none">
  <div class="card">
    <h2>🔧 诊断信息 <span>系统状态检查</span></h2>
    <div id="debug-info" class="debug">加载诊断信息中...</div>
    <button class="debug-btn" onclick="runDiagnostic()">运行诊断</button>
    <button class="debug-btn" onclick="toggleDebug()">关闭</button>
  </div>
</div>

<div id="root"><div class="empty">初始化中…（若持续超过 10 秒无变化，说明页面脚本未运行）</div></div>

<footer>数据来自本地 SQLite · 只读，不消耗 API 额度 · <b id="build">BUILD-</b></footer>

<script>
const $ = (id) => document.getElementById(id);
const debugLog = [];

function addDebugLog(msg) {
  debugLog.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
  console.log(msg);
}

function toggleDebug() {
  const panel = $('debug-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if(panel.style.display === 'block') {
    runDiagnostic();
  }
}

async function runDiagnostic() {
  debugLog.length = 0;
  $('debug-info').textContent = '正在诊断...';
  addDebugLog('=== 开始系统诊断 ===');
  
  // 检查基本连接
  addDebugLog('1. 检查API服务连接...');
  try {
    const health = await fetch('/health', {cache:'no-store'});
    addDebugLog(`   GET /health → ${health.status}`);
    if(health.ok) {
      const data = await health.json();
      addDebugLog(`   响应: ${JSON.stringify(data)}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  // 检查fixtures端点
  addDebugLog('\\n2. 检查赛程数据...');
  try {
    const fx = await fetch('/fixtures', {cache:'no-store'});
    addDebugLog(`   GET /fixtures → ${fx.status}`);
    if(fx.ok) {
      const data = await fx.json();
      addDebugLog(`   响应状态: ${data.status}`);
      addDebugLog(`   数据量: ${data.total} 场比赛`);
      addDebugLog(`   联赛数: ${(data.leagues||[]).length}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  // 检查health/model端点
  addDebugLog('\\n3. 检查模型健康度...');
  try {
    const model = await fetch('/health/model', {cache:'no-store'});
    addDebugLog(`   GET /health/model → ${model.status}`);
    if(model.ok) {
      const data = await model.json();
      addDebugLog(`   状态: ${data.status}`);
      addDebugLog(`   已结算: ${data.settled||0} 场`);
      addDebugLog(`   命中率: ${data.accuracy ? (data.accuracy*100).toFixed(1)+'%' : '无'}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  // 检查audit端点
  addDebugLog('\\n4. 检查预测审计...');
  try {
    const audit = await fetch('/audit?limit=5', {cache:'no-store'});
    addDebugLog(`   GET /audit → ${audit.status}`);
    if(audit.ok) {
      const data = await audit.json();
      addDebugLog(`   预测数: ${(data.items||[]).length}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  // 检查strength端点
  addDebugLog('\\n5. 检查球队强度榜...');
  try {
    const st = await fetch('/strength', {cache:'no-store'});
    addDebugLog(`   GET /strength → ${st.status}`);
    if(st.ok) {
      const data = await st.json();
      addDebugLog(`   状态: ${data.status}`);
      addDebugLog(`   球队数: ${(data.teams||[]).length}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  addDebugLog('\\n=== 诊断完成 ===');
  $('debug-info').textContent = debugLog.join('\\n');
}

async function get(url, timeoutMs){
  addDebugLog(`正在请求: ${url}`);
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ac ? setTimeout(() => ac.abort(), timeoutMs || 8000) : null;
  try {
    const r = await fetch(url, {cache:'no-store', signal: ac ? ac.signal : undefined});
    addDebugLog(`响应状态: ${url} → ${r.status}`);
    if(!r.ok) throw new Error(url + ' → HTTP ' + r.status);
    const data = await r.json();
    addDebugLog(`获得数据: ${url} → ${JSON.stringify(data).substring(0,100)}`);
    return data;
  } catch(err) {
    const msg = (err && err.name === 'AbortError') ? (url + ' → 超时(' + (timeoutMs||8000) + 'ms)') : (url + ' → ' + err.message);
    addDebugLog(`请求失败: ${msg}`);
    throw new Error(msg);
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function esc(s){
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- SVG 折线图：Log Loss 趋势 ---------- */
function lineChart(series, opts){
  const W = 600, H = 180, P = {l:38, r:8, t:10, b:24};
  if(!series || series.length < 2) return '<div class="empty">数据点不足，无法绘制趋势。</div>';
  const vals = series.map(p => p.v).filter(v => typeof v === 'number' && isFinite(v));
  if(!vals.length) return '<div class="empty">无有效数据。</div>';
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi - lo < 1e-9){ lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => P.l + (W-P.l-P.r) * i / (series.length - 1);
  const y = v => P.t + (H-P.t-P.b) * (1 - (v - lo) / (hi - lo));

  let grid = '', pts = '';
  for(let g=0; g<=3; g++){
    const v = lo + (hi-lo)*g/3, yy = y(v);
    grid += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#252a34" stroke-width="1"/>`
         +  `<text x="${P.l-6}" y="${yy+3.5}" fill="#9aa3b2" font-size="10" text-anchor="end">${v.toFixed(2)}</text>`;
  }
  series.forEach((p,i) => { pts += (i? ' L':'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Log Loss 趋势">
    ${grid}
    <path d="${pts}" fill="none" stroke="${opts.color}" stroke-width="2" stroke-linejoin="round"/>
    <text x="${W-P.r}" y="${H-6}" fill="#9aa3b2" font-size="10" text-anchor="end">场次数 →</text>
  </svg>`;
}

/* ---------- SVG 散点+对角线：校准曲线 ---------- */
function calibChart(buckets){
  if(!buckets || !buckets.length) return '<div class="empty">暂无校准数据。</div>';
  const W = 300, H = 300, P = 34;
  const x = v => P + (W-2*P) * v;
  const y = v => (H-P) - (H-2*P) * v;
  let g = '';
  for(let t=0; t<=1.0001; t+=0.25){
    g += `<line x1="${x(t)}" y1="${P-8}" x2="${x(t)}" y2="${H-P}" stroke="#1e222b"/>`
      +  `<line x1="${P-8}" y1="${y(t)}" x2="${W-P}" y2="${y(t)}" stroke="#1e222b"/>`
      +  `<text x="${x(t)}" y="${H-P+14}" fill="#9aa3b2" font-size="9.5" text-anchor="middle">${t.toFixed(2)}</text>`
      +  `<text x="${P-11}" y="${y(t)+3.5}" fill="#9aa3b2" font-size="9.5" text-anchor="end">${t.toFixed(2)}</text>`;
  }
  let dots = '';
  buckets.forEach(b => {
    const r = 3 + Math.min(9, Math.sqrt(b.n) * 1.4);   // 点的大小表示样本量
    dots += `<circle cx="${x(b.predicted).toFixed(1)}" cy="${y(b.observed).toFixed(1)}" r="${r.toFixed(1)}"
      fill="#4da3ff" fill-opacity="0.55" stroke="#4da3ff" stroke-width="1.2"><title>${esc(b.range)} · n=${b.n}</title></circle>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="校准曲线">
    ${g}
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="#3ddc97" stroke-width="1.4" stroke-dasharray="5 4"/>
    ${dots}
    <text x="${W/2}" y="${H-4}" fill="#9aa3b2" font-size="10" text-anchor="middle">模型预测的概率</text>
    <text transform="translate(11 ${H/2}) rotate(-90)" fill="#9aa3b2" font-size="10" text-anchor="middle">实际发生频率</text>
  </svg>
  <div style="font-size:12px;color:var(--dim);margin-top:2px">绿色虚线 = 完美校准；点越贴近它越好，圆越大表示该区间样本越多。</div>`;
}

/* ---------- 分区容器 ----------
   看板内容按「赛程 / 模型表现 / 回测 / 审计 / 强度」分组，
   每组一个标题条 + 吸顶导航，避免十几张卡片平铺到底找不着重点。 */
function section(id, icon, title, note, inner){
  return `<section class="sec" id="${id}">`
    + `<div class="sechd"><b>${icon} ${title}</b>${note ? `<span>${esc(note)}</span>` : ''}</div>`
    + `<div class="secbody">${inner}</div></section>`;
}

function goSec(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'start'});
  const btns = document.querySelectorAll('.secnav button');
  for(let i=0;i<btns.length;i++){
    btns[i].className = (btns[i].getAttribute('data-sec') === id) ? 'on' : '';
  }
}

/* ---------- 渲染 ---------- */
const LV = {high:'🟢 高', medium:'🟡 中', low:'🔴 低', unknown:'未知'};

function statCard(health, noHead){
  const acc = health.accuracy == null ? '—' : (health.accuracy*100).toFixed(1)+'%';
  const ll  = health.mean_log_loss == null ? '—' : health.mean_log_loss.toFixed(4);
  const ece = health.ece == null ? '—' : health.ece.toFixed(4);
  // 超期未结算：这些行已开赛但超出回溯窗口，永远结算不了。
  // 它们不再堵塞结算队列（下界已挡住），但数量是故障信号——
  // 赛季切换后的失效 ID，或某几天赛果没拉回来。
  // null = 读不到，必须显示成未知而不是 0（0 会被读成"一切正常"）。
  const sp = health.stale_pending;
  const stale = (sp == null)
    ? `<div class="stat"><b>—</b><i>超期未结算 · 未知</i></div>`
    : (sp > 0
        ? `<div class="stat bad"><b>${sp}</b><i>超期未结算</i></div>`
        : `<div class="stat"><b>0</b><i>超期未结算</i></div>`);
  return `<div class="card">` + (noHead ? '' : '<h2>关键指标</h2>') + `<div class="grid">
    <div class="stat"><b>${health.settled ?? 0}</b><i>已结算场次</i></div>
    <div class="stat"><b>${acc}</b><i>命中率</i></div>
    <div class="stat"><b>${ll}</b><i>平均 Log Loss ↓</i></div>
    <div class="stat"><b>${ece}</b><i>校准误差 ECE ↓</i></div>
    ${stale}
  </div>` + (sp > 0
      ? `<div class="why">⚠️ 有 ${sp} 场已开赛但超出结算回溯窗口，将不会被结算
         （常见原因：赛季切换后 ID 失效、该时段赛果未拉回）。它们不堵塞结算队列，
         但会拉低已结算样本的完整性。</div>`
      : '') + `</div>`;
}

function trendCard(health){
  if(health.status === 'empty') return `<div class="card"><h2>模型健康度</h2><div class="empty">${esc(health.message)}</div></div>`;
  const series = (health.trend||[]).map(p => ({v:p.log_loss}));
  return `<div class="card">
    <h2>模型健康度 <span>累积平均 Log Loss</span></h2>
    ${health.message ? `<div class="note">${esc(health.message)}</div>`:''}
    ${lineChart(series,{color:'#4da3ff'})}
  </div>`;
}

function calibCard(health){
  if(health.status === 'empty') return '';
  if(!(health.calibration||[]).length){
    return `<div class="card"><h2>校准曲线 <span>说的 vs 发生的</span></h2>`
      + `<div class="empty">暂无校准数据。</div>`
      + `<div class="why">校准需要已结算场次按置信度分档统计，样本积累后自动出现。</div></div>`;
  }
  return `<div class="card">
    <h2>校准曲线 <span>说的 vs 发生的</span></h2>
    ${calibChart(health.calibration)}
  </div>`;
}

function levelCard(health){
  const lv = health.by_level || {};
  const keys = Object.keys(lv).filter(k => lv[k] && lv[k].total);
  if(!keys.length){
    return `<div class="card"><h2>信心等级命中率 <span>高信心应高于低信心</span></h2>`
      + `<div class="empty">暂无分级数据。</div>`
      + `<div class="why">需要已结算的预测带信心等级（level_key）才能统计。</div></div>`;
  }
  let rows = '';
  ['high','medium','low','unknown'].filter(k=>lv[k]).forEach(k=>{
    const s = lv[k], rate = s.rate ?? 0;
    rows += `<div class="lv"><i>${LV[k]||k}</i><div class="bar"><i style="width:${(rate*100).toFixed(1)}%"></i></div>
      <b>${(rate*100).toFixed(1)}% · ${s.hit}/${s.total}</b></div>`;
  });
  return `<div class="card"><h2>信心等级命中率 <span>高信心应高于低信心</span></h2>${rows}</div>`;
}

function strengthCard(st, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>球队强度榜 <span>模型在用的攻防强度</span></h2>');
  if(st.status === 'insufficient' || st.status === 'error')
    return head + `<div class="empty">${esc(st.message || '暂不可用')}</div></div>`;
  const teams = st.teams || [];
  if(!teams.length) return head + `<div class="empty">暂无数据。</div></div>`;
  let rows = '';
  teams.slice(0,20).forEach((t,i)=>{
    rows += `<tr><td class="num">${i+1}</td><td>${esc(t.name_cn || t.name)}</td>
      <td class="num">${t.played}</td><td class="num">${t.attack.toFixed(2)}</td>
      <td class="num">${t.defense.toFixed(2)}</td><td class="num"><b>${t.overall.toFixed(2)}</b></td></tr>`;
  });
  return head + `<div class="tblwrap"><table class="tbl-st">
    <thead><tr><th>#</th><th>球队</th><th class="num">场次</th><th class="num">进攻</th><th class="num">防守</th><th class="num">综合</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div style="font-size:12px;color:var(--dim);margin-top:8px">进攻越大越强；防守越大表示失球越多（越差）。综合 = 进攻 − 防守。</div>
  </div>`;
}

function jobsCard(jb, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>定时任务状态 <span>最近一次执行结果</span></h2>');
  const last = (jb && jb.last) || {};
  const keys = Object.keys(last);
  if(!keys.length){
    return head + `<div class="empty">尚无任务记录。</div>`
      + `<div class="why">${esc((jb && jb.message) || '定时任务按各自间隔启动。')}</div></div>`;
  }
  // 故障排最前：一眼先看到坏掉的
  const ORDER = {fail:0, unknown:1, skip:2, ok:3};
  const JNAME = {sync:'赛程同步', history:'历史回填', backtest:'回测',
                 auto_predict:'自动预测', settle:'赛果结算', prematch:'赛前刷新',
                 review:'每日复盘', daily:'每日推送'};
  let rows = '';
  keys.sort((a,b)=>(ORDER[last[a].status]??9)-(ORDER[last[b].status]??9));
  for(const k of keys){
    const v = last[k], st = v.status || 'unknown';
    const cls = st==='ok' ? 'jok' : (st==='fail' ? 'jfail' : 'jskip');
    const mark = st==='ok' ? '✓' : (st==='fail' ? '✗' : (st==='skip' ? '–' : '?'));
    const msg = v.message ? esc(v.message) : (st==='ok' ? '正常' : '');
    rows += `<tr><td><span class="jb ${cls}">${mark}</span> ${esc(JNAME[k] || k)}</td>`
      + `<td class="num">${esc(String(v.created_at||'').slice(5,16).replace('T',' '))}</td>`
      + `<td class="jmsg">${msg}</td></tr>`;
  }
  return head + `<div class="tblwrap"><table class="tbl-jobs">
    <thead><tr><th>任务</th><th class="num">时间</th><th>说明</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="why">✗ = 最近一次失败（需排查） · – = 主动跳过（非故障） · ? = 从未记录</div>
    </div>`;
}

function quotaCard(qt, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>额度消耗 <span>按任务拆分 · 当日累计</span></h2>');
  const total = (qt && qt.total) || 0;
  const byTask = (qt && qt.by_task) || {};
  const keys = Object.keys(byTask);
  if(!keys.length){
    return head + `<div class="empty">尚无额度记录。</div>`
      + `<div class="why">请求发出后才会计数，刚重启时为空属正常。</div></div>`;
  }
  // 任务中文名：与 jobsCard 保持同一份口径，避免同一任务两种叫法
  const JNAME = {sync_matches:'赛程同步', sync_history:'历史回填', backtest_run:'回测',
                 auto_predict:'自动预测', settle_results:'赛果结算',
                 prematch_refresh:'赛前刷新', daily_review:'每日复盘',
                 daily_push:'每日推送', cache_purge:'缓存清理', other:'其他'};
  const max = Math.max(...keys.map(k=>byTask[k]), 1);
  let rows = '';
  for(const k of keys){
    const n = byTask[k];
    // 占比条：一眼看出谁是大头，比读数字快
    const pct = Math.round(n / max * 100);
    const share = total ? ((n/total)*100).toFixed(1) : '0.0';
    rows += `<tr><td>${esc(JNAME[k] || k)}</td>`
      + `<td class="num">${n}</td>`
      + `<td class="qbar"><span style="width:${pct}%"></span></td>`
      + `<td class="num">${share}%</td></tr>`;
  }
  // 剩余次数：null 表示本进程还没观测到，必须说清，不能显示成 0
  const leftLine = (qt && qt.quota_left != null)
    ? `主源剩余 <b>${esc(String(qt.quota_left))}</b> 次`
    : '主源剩余：尚未观测到（本进程还没发过请求，不代表已耗尽）';
  // 用 tbl-quota 而非 tbl-jobs：后者在窄屏会隐藏第 2 列，
  // 而「次数」正是这个板块唯一必须看得见的数字。
  return head + `<div class="tblwrap"><table class="tbl-quota">
    <thead><tr><th>任务</th><th class="num">次数</th><th>占比</th><th class="num">份额</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="why">当日合计 <b>${total}</b> 次 · ${leftLine}</div>
    </div>`;
}

function backtestCard(bt, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>历史回测结论 <span>Walk-Forward · 只用赛前数据，无前视偏差</span></h2>');
  if(!bt || bt.status === 'empty' || !bt.count){
    return head + `<div class="empty">${esc(bt && bt.message ? bt.message : '尚无回测记录。')}</div></div>`;
  }
  const rows = (bt.items||[]).map(r => {
    const acc  = r.accuracy  == null ? '—' : (r.accuracy*100).toFixed(2)+'%';
    // 精确比分：与方向命中是两把不同的尺子，绝不合并成一列显示
    const ex   = r.exact_rate == null ? '—' : (r.exact_rate*100).toFixed(2)+'%';
    const ll   = r.log_loss  == null ? '—' : Number(r.log_loss).toFixed(4);
    const rps  = r.rps       == null ? '—' : Number(r.rps).toFixed(4);
    const dbc  = r.corpus_db ?? 0, cvc = r.corpus_csv ?? 0;
    // 样本增量：0 表示这次语料没长，数字与上次完全一样属于正常
    const nw   = r.n_new == null ? '—' : (r.n_new > 0 ? '+'+r.n_new : '0');
    return `<tr><td>${esc(String(r.created_at||'').slice(0,16).replace('T',' '))}</td>`
      + `<td>${esc(r.variant||'')}</td><td class="num">${r.n ?? 0}</td>`
      + `<td class="num" title="方向命中率：猜中主胜/平/客胜">${acc}</td>`
      + `<td class="num" title="精确比分命中率：猜中具体比分如 2-1">${ex}</td>`
      + `<td class="num">${ll}</td><td class="num">${rps}</td>`
      + `<td class="num" title="相比上次回测，语料新增的场次数">${nw}</td>`
      + `<td class="num">${dbc}/${cvc}</td><td>${esc(r.verdict||'')}</td></tr>`;
  }).join('');
  const win = (bt.items && bt.items[0] && (bt.items[0].window_start || bt.items[0].window_end))
    ? ` · 语料窗口 ${esc(String(bt.items[0].window_start||'')).slice(0,10)} → ${esc(String(bt.items[0].window_end||'')).slice(0,10)}`
    : '';
  return head + `<div class="tblwrap"><table class="tbl-bt"><thead><tr><th>时间</th><th>口径</th><th class="num">场次</th>`
    + `<th class="num">方向命中</th><th class="num">比分命中</th>`
    + `<th class="num">Log Loss</th><th class="num">RPS</th>`
    + `<th class="num">新增</th><th class="num">库内/语料</th><th>判定</th></tr></thead>`
    + `<tbody>${rows}</tbody></table></div>`
    + `<div style="font-size:12px;color:var(--dim);margin-top:8px">`
    + `共 ${bt.count} 条记录 · 「库内/语料」说明结论基于多少真实赛果，库内越多越贴近线上${win}`
    + `</div>`
    + `<div style="font-size:12px;color:var(--dim);margin-top:4px">`
    + `<b>两个口径不要混看</b>：方向命中 = 猜中主胜/平/客胜（随机基线 33%，45~55% 算良好）；`
    + `比分命中 = 猜中具体比分如 2-1（业界仅 5~8%）。`
    + `看到比分命中 5% 不是模型崩了，两把尺子差约 10 倍。`
    + `</div></div>`;
}

/* 预测方向 → 中文。后端存的是 home/draw/away，直接显示英文不利于快速扫读。 */
const PRED = {home:'主胜', draw:'平局', away:'客胜'};

function auditCard(a, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>预测审计 <span>预测 vs 实际</span></h2>');
  const items = a.items || [];
  if(!items.length){
    return head + `<div class="empty">暂无已结算的预测。</div>`
      + `<div class="why">比赛结束后赛果由 settle_job 每 6 小时同步结算一次，`
      + `结算完成才会出现在这里。</div></div>`;
  }

  // 宽屏：表格
  let rows = '';
  items.slice(0,30).forEach(it=>{
    rows += `<tr>
      <td>${esc(String(it.kickoff||'').slice(0,10))}</td>
      <td>${esc(it.home_cn || it.home)} vs ${esc(it.away_cn || it.away)}</td>
      <td>${esc(PRED[it.predicted] || it.predicted || '—')}</td>
      <td class="num">${esc(it.score)}</td>
      <td class="${it.hit?'hit':'miss'}">${it.hit?'✓':'✗'}</td></tr>`;
  });
  const tbl = `<div class="tblwrap audit-tbl"><table>
    <thead><tr><th>日期</th><th>比赛</th><th>预测</th><th class="num">比分</th><th>结果</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

  // 窄屏：卡片流。表格 5 列在手机上横向溢出，预测/比分/结果三列
  // 被推到屏幕外——表现为「板块只有日期和比赛两列」。
  let cards = '';
  items.slice(0,30).forEach(it=>{
    cards += `<div class="arow">
      <div class="at"><span>${esc(it.home_cn || it.home)} vs ${esc(it.away_cn || it.away)}</span>
        <span class="sc">${esc(it.score || '—')}</span></div>
      <div class="am">
        <span class="tag ${it.hit?'ok':'no'}">${it.hit?'命中':'未中'}</span>
        <span>预测 ${esc(PRED[it.predicted] || it.predicted || '—')}</span>
        <span class="dt">${esc(String(it.kickoff||'').slice(0,10))}</span>
      </div></div>`;
  });

  return head + tbl + `<div class="audit-list">${cards}</div>` + `</div>`;
}

/* ---------- 今日赛程：与 Telegram 推送同源 ---------- */
const ST = {NS:'未开始', TBD:'待定', FT:'完场', AET:'加时', PEN:'点球',
            '1H':'上半场', '2H':'下半场', HT:'中场', LIVE:'进行中',
            PST:'推迟', CANC:'取消', ABD:'中断', SUSP:'暂停', INT:'待续'};

function hhmm(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(11,16);
  return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Shanghai'});
}

/* 赛程范围：1=今天，3/7=含今天在内的未来几天。
   联赛并非每天都有比赛，只看「今天」时整页空白容易被当成看板坏了。 */
let RANGE = 1;
function setRange(n){ RANGE = n; load(); }

function formDots(form){
  if(!form || !form.length) return '<span class="form empty">暂无</span>';
  let h = '<span class="form">';
  form.forEach(f=>{
    const c = f.r === 'W' ? 'w' : (f.r === 'D' ? 'd' : 'l');
    const zh = f.r === 'W' ? '胜' : (f.r === 'D' ? '平' : '负');
    const tip = `${f.date} ${f.home ? '主' : '客'}对${f.opp} ${f.gf}-${f.ga}`;
    h += `<i class="${c}" title="${esc(tip)}">${zh}</i>`;
  });
  return h + '</span>';
}

function teamRow(t, name){
  t = t || {};
  // 缺数据一律显示「—」：把 null 当成 0 会让一支没回填的队看起来极弱。
  const rating = t.rating != null ? String(t.rating) : '—';
  const rank = t.rank != null ? `#${t.rank}` : '';
  const rec = (t.w != null) ? `${t.w}胜${t.d}平${t.l}负` : '';
  const gl = (t.gf != null) ? `进${t.gf}失${t.ga}` : '';
  return `<div class="team">
    <span class="tn">${esc(name)}</span>
    <span class="tm">${rank} <b>${rating}</b> <i>${esc(rec)} ${esc(gl)}</i></span>
    ${formDots(t.form)}</div>`;
}

function matchCard(m){
  const done = m.status === 'FT' || m.status === 'AET' || m.status === 'PEN';
  const score = done && m.home_score != null && m.away_score != null
    ? `<b class="sc">${m.home_score}-${m.away_score}</b>`
    : `<span class="st">${esc(ST[m.status] || m.status || '')}</span>`;
  const md = m.matchday != null ? `<span class="pill2">第${esc(String(m.matchday))}轮</span>` : '';
  const p = m.prediction;
  // 「还没算」必须区别于「算出来是 0」：p 为 null 表示未生成预测，不画假概率条。
  let bar = '<div class="form empty" style="margin-top:6px">尚未生成预测</div>';
  if(p){
    const h = (p.home_prob||0)*100, d = (p.draw_prob||0)*100, a = (p.away_prob||0)*100;
    bar = `<div class="pbar"><i class="h" style="width:${h.toFixed(1)}%"></i>`
        + `<i class="d" style="width:${d.toFixed(1)}%"></i>`
        + `<i class="a" style="width:${a.toFixed(1)}%"></i></div>`
        + `<div class="plegend"><span>主 ${h.toFixed(0)}%</span><span>平 ${d.toFixed(0)}%</span>`
        + `<span>客 ${a.toFixed(0)}%</span><b>${esc(p.result||'')}</b></div>`;
  }
  return `<div class="match">
    <div class="mhead"><span class="md">${hhmm(m.kickoff)}</span>${md}${score}</div>
    ${teamRow(m.home_team, m.home_cn || m.home)}
    ${teamRow(m.away_team, m.away_cn || m.away)}
    ${bar}</div>`;
}

/* 折叠状态：联赛代码 → 是否展开。
   默认只展开第一场有比赛的联赛：全部展开会让「今天有哪些联赛」这个
   首要问题淹没在一长串比赛里；全部收起又等于让人多点一次。 */
let OPEN_LG = {};
let LG_INITED = false;
function toggleLg(code){
  OPEN_LG[code] = !OPEN_LG[code];
  renderLg(code);
}
function renderLg(code){
  const box = document.getElementById('lg-' + code);
  if(!box) return;
  const open = !!OPEN_LG[code];
  box.style.display = open ? '' : 'none';
  const btn = document.getElementById('lgb-' + code);
  if(btn) btn.textContent = open ? '收起' : '展开';
  const hd = document.getElementById('lgh-' + code);
  if(hd) hd.classList.toggle('open', open);
}

/* 赛程行：只保留「时间 / 队伍 / 预测按钮」。
   近况色块与战绩全移到详情面板——主列表的职责是让人一眼扫出
   今天有什么比赛，不是把所有数字摊平在首屏。 */
function matchRow(m){
  const p = m.prediction;
  const btn = p
    ? `<button class="pbtn" onclick="showPrediction('${esc(m.fixture_id)}')">📈 预测</button>`
    : `<span class="pbtn off" title="预测由 auto_predict 任务自动生成">未生成</span>`;
  const hn = esc(m.home_cn || m.home || '?');
  const an = esc(m.away_cn || m.away || '?');
  // 竖排判定按**显示宽度**算：中文一个字顶两个英文字符。
  // 横排可用宽度约 20 个字符宽，超了就竖排，宁可多两行也不截断队名。
  const w = txt => [...txt].reduce((s,c)=> s + (c.charCodeAt(0) > 255 ? 2 : 1), 0);
  const stack = (w(hn) + w(an)) > 20 ? ' stack' : '';
  return `<div class="mrow">
    <span class="mtime">${hhmm(m.kickoff)}</span>
    <span class="mvs${stack}"><b>${hn}</b><i>vs</i><b>${an}</b></span>
    ${btn}</div>`;
}

async function showPrediction(fid){
  const box = $('modal');
  box.style.display = 'flex';
  box.innerHTML = `<div class="mbox"><div class="mhd"><b>预测详情</b>
    <button onclick="closeModal()">关闭</button></div>
    <div class="empty">加载中…</div></div>`;
  let d;
  try{
    d = await get('/prediction/' + encodeURIComponent(fid));
  }catch(err){
    box.innerHTML = `<div class="mbox"><div class="mhd"><b>预测详情</b>
      <button onclick="closeModal()">关闭</button></div>
      <div class="err">加载失败：${esc(err.message || String(err))}</div></div>`;
    return;
  }
  box.innerHTML = `<div class="mbox"><div class="mhd"><b>预测详情</b>
    <button onclick="closeModal()">关闭</button></div>${predictionBody(d)}</div>`;
}
function closeModal(){ $('modal').style.display = 'none'; }

function traceSection(d){
  const t = d && d.trace;
  // 老预测没有 trace（本次上线前生成的）。
  // 必须显式说明"这条是旧数据"，而不是渲染成空表——
  // 空表会被读成"每个环节影响都是零"。
  if(!t || !t.stages || !t.stages.length){
    return `<div class="msec"><h4>🧭 决策链</h4>
      <div class="dim">这条预测生成于可追溯功能上线之前，未留存决策链。
      下一次自动预测（每 6 小时）生成的预测会带上。</div></div>`;
  }
  const P = p => (Array.isArray(p)&&p.length===3)
    ? `主 ${(p[0]*100).toFixed(0)}% · 平 ${(p[1]*100).toFixed(0)}% · 客 ${(p[2]*100).toFixed(0)}%`
    : null;
  let out = `<div class="msec"><h4>🧭 决策链</h4><div class="trace">`;
  t.stages.forEach((s,i)=>{
    const pv = P(s.probs);
    out += `<div class="trow"><span class="tkey">${esc(s.label||s.key||'')}</span>`
      + `<span class="tval">${pv?esc(pv):'<i>未记录</i>'}</span></div>`;
    if(s.key==='temperature' && s.temperature!=null && Math.abs(s.temperature-1)>1e-6){
      out += `<div class="tnote">温度 T=${s.temperature}（拉平概率以修正过度自信）</div>`;
    }
    if(s.key==='ensemble' && s.weights){
      const w = Object.entries(s.weights)
        .map(([k,v])=>`${esc(k)} ${(v*100).toFixed(0)}%`).join(' · ');
      out += `<div class="tnote">权重：${w}${s.fallback?' <b class="badText">（已回落经验值）</b>':''}</div>`;
    }
    if(s.key==='model'){
      out += `<div class="tnote">赛前信号（伤停/首发）：`
        + `${s.prematch_applied?'已应用':'未应用'}</div>`;
    }
    if(i < t.stages.length-1){
      const nx = t.stages[i+1];
      if(P(s.probs) && P(nx.probs)){
        const dh = (nx.probs[0]-s.probs[0])*100;
        out += `<div class="tdelta">→ 进入下一阶段后，主胜 `
          + `${dh>=0?'+':''}${dh.toFixed(1)} 个百分点</div>`;
      }
    }
  });
  out += `</div>`;
  const ft = t.features;
  if(ft){
    out += `<div class="tfeat">输入特征：主攻 ${ft.home_attack} / 主防 ${ft.home_defense}`
      + ` · 客攻 ${ft.away_attack} / 客防 ${ft.away_defense}`
      + ` · 联赛均值 ${ft.league_avg_home}:${ft.league_avg_away}`
      + ` · ρ ${ft.rho}</div>`;
    out += `<div class="tfeat">Elo 融合系数：<b class="${ft.elo_factor==null?'badText':''}">`
      + `${ft.elo_factor==null?'未启用（生产路径当前不传该参数）':ft.elo_factor}</b></div>`;
  }
  if(t.market){
    out += `<div class="tfeat">市场口径：主 ${(t.market.home*100).toFixed(0)}%`
      + ` · 平 ${(t.market.draw*100).toFixed(0)}% · 客 ${(t.market.away*100).toFixed(0)}%</div>`;
  }
  out += `<div class="dim">最终展示概率 = 最后一阶段的输出，与上方概率条一致。</div></div>`;
  return out;
}

function predictionBody(d){
  const p = d.probs || {};
  const f = v => (v == null ? '—' : Number(v).toFixed(2));
  const pc = v => (v == null ? '—' : (Number(v)*100).toFixed(1) + '%');
  const h = (p.home||0)*100, dr = (p.draw||0)*100, a = (p.away||0)*100;
  const _hn = esc(d.home_cn||d.home||'?'), _an = esc(d.away_cn||d.away||'?');
  const _w = t => [...t].reduce((s,c)=> s + (c.charCodeAt(0) > 255 ? 2 : 1), 0);
  const _st = (_w(_hn) + _w(_an)) > 20 ? ' stack' : '';
  let html = `<div class="mteams${_st}"><b>${_hn}</b><i>vs</i><b>${_an}</b></div>`;
  html += `<div class="mmeta">${esc(d.league_cn||d.league||'')}`
    + (d.kickoff ? ` · ${esc(String(d.kickoff).slice(5,16).replace('T',' '))}` : '')
    + `</div>`;

  // 方向 + 概率条
  html += `<div class="msec"><h4>🎯 预测方向</h4>
    <div class="pbar"><i class="h" style="width:${h.toFixed(1)}%"></i>`
    + `<i class="d" style="width:${dr.toFixed(1)}%"></i>`
    + `<i class="a" style="width:${a.toFixed(1)}%"></i></div>
    <div class="plegend"><span>主 ${h.toFixed(0)}%</span><span>平 ${dr.toFixed(0)}%</span>`
    + `<span>客 ${a.toFixed(0)}%</span><b>${esc(d.result||'')}</b></div></div>`;

  // 比分 / 大小球 / 信心
  const ts = (d.top_scores||[]).slice(0,5).map(s=>
    `${esc(s[0])} <span class="dim">${(s[1]*100).toFixed(1)}%</span>`).join(' · ');
  html += `<div class="msec"><h4>⚽ 比分与进球</h4>
    <div class="mgrid">
      <div><i>最可能比分</i><b>${esc(d.best_score||'—')}</b></div>
      <div><i>预期进球</i><b>${f(d.lambda_home)} : ${f(d.lambda_away)}</b></div>
      <div><i>大小球 2.5</i><b>${d.over_2_5==null?'—':(d.over_2_5*100).toFixed(1)+'% 大球'}</b></div>
      <div><i>双方进球</i><b>${d.btts==null?'—':pc(d.btts)}</b></div>
      <div><i>信心等级</i><b>${esc(LV[d.level_key]||d.level_key||'—')}</b></div>
      <div><i>预测时间</i><b>${d.predicted_at?esc(String(d.predicted_at).slice(5,16).replace('T',' ')):'—'}</b></div>
    </div>${ts?`<div class="mtop">常见比分：${ts}</div>`:''}</div>`;

  // 决策链：这个概率是怎么一步步变成的
  html += traceSection(d);

  // 赔率
  html += `<div class="msec"><h4>💰 赔率</h4>`;
  if(d.odds){
    const im = d.odds.implied || {};
    html += `<div class="mgrid">
      <div><i>主</i><b>${f(d.odds.home)}</b></div>
      <div><i>平</i><b>${f(d.odds.draw)}</b></div>
      <div><i>客</i><b>${f(d.odds.away)}</b></div></div>`;
    html += `<div class="mtop">市场隐含概率（去水后）：主 ${pc(im.home)} · 平 ${pc(im.draw)} · 客 ${pc(im.away)}`
      + (d.odds.n_bookmakers?` · ${d.odds.n_bookmakers} 家公司中位`:'') + `</div>`;
  }else{
    html += `<div class="dim">${esc(d.odds_error || (d.errors && d.errors.odds) || '暂无赔率数据')}</div>`;
  }
  html += `</div>`;

  // 阵容
  html += `<div class="msec"><h4>👥 首发阵容</h4>`;
  if((d.lineups||[]).length){
    d.lineups.forEach(t=>{
      const xi = (t.start_xi||[]).map(x=>esc(x.name)).filter(Boolean);
      html += `<div class="lxi"><b>${esc(t.team_cn||t.team)}${t.formation?' · '+esc(t.formation):''}</b>`
        + `<span>${xi.length?xi.join('、'):'首发未公布'}</span></div>`;
    });
  }else{
    html += `<div class="dim">${esc((d.errors&&d.errors.lineups)||'阵容未公布（通常赛前 20–40 分钟才出）')}</div>`;
  }
  html += `</div>`;

  const fa = d.fetched_at || {};
  const stamp = (k, label) => {
    const t = fa[k];
    if(!t) return '';
    const s = String(t).slice(11,19);
    return fa[k + '_stale']
      ? `<div class="dim">${label}为 ${esc(s)} UTC 的快照（本次实时拉取失败）</div>`
      : `<div class="dim">${label}取于 ${esc(s)} UTC（缓存有效期内，重复打开不再重复请求）</div>`;
  };
  html += stamp('odds', '赔率') + stamp('lineups', '阵容');
  html += `<div class="mfoot">阵容与赔率走缓存（多人打开同一场仅取一次），`
    + `方向/比分/大小球为预测时落盘的快照 · 仅供参考，不构成投注建议</div>`;
  return html;
}

function fixturesCard(fx, noHead){
  const btns = [1,3,7].map(n=>
    `<button class="rbtn${RANGE===n?' on':''}" onclick="setRange(${n})">${n===1?'今天':(n===3?'3 天':'7 天')}</button>`
  ).join('');
  const span = fx.date_to && fx.date_to !== fx.date_from
    ? `${esc(fx.date_from||'')} ~ ${esc(fx.date_to)}` : esc(fx.date_from || fx.date || '');
  const head = `<div class="card">`
    + (noHead ? '' : `<h2>今日赛程 <span>${span} · 点联赛展开</span></h2>`)
    + `<div class="rbtns">${btns}</div>`;
  const leagues = fx.leagues || [];
  if(!leagues.length){
    return head + `<div class="empty">${esc(fx.message || '区间内没有比赛。')}</div></div>`;
  }
  let html = '';
  leagues.forEach((g, idx)=>{
    const code = esc(g.competition || ('lg' + idx));
    // 默认全部展开：用户要的是「一眼看到今天有哪些联赛、各自有什么比赛」，
    // 只展开第一个等于让人逐个点开。折叠能力保留，由用户自己收。
    if(!LG_INITED) OPEN_LG[g.competition || ('lg'+idx)] = true;
    const byDate = {};
    (g.matches||[]).forEach(m=>{
      const d = m.date || '';
      (byDate[d] = byDate[d] || []).push(m);
    });
    let inner = '';
    Object.keys(byDate).sort().forEach(d=>{
      inner += `<div class="dsep">${esc(d)}</div>` + byDate[d].map(matchRow).join('');
    });
    html += `<div class="lg"><div class="lgh" id="lgh-${code}">`
      + `<button class="lgtoggle" id="lgb-${code}" onclick="toggleLg('${code}')">展开</button>`
      + `<span class="lgemblem">${esc(g.competition_flag || '⚽')}</span>`
      + `<span class="lgname">${esc(g.competition_cn || g.competition || '未知联赛')}</span>`
      + `<span class="lgshort">${esc(g.competition_short || '')}</span>`
      + `<span>${g.count} 场</span></div>`
      + `<div class="lgbody" id="lg-${code}">${inner}</div></div>`;
  });
  LG_INITED = true;
  return head + html
    + `<div class="fnote">共 ${fx.total} 场 · 时间为北京时间 · 点「预测」展开单场完整数据`
    + ` · 仅供参考，不构成投注建议</div></div>`;
}

function liveOddsRow(odds){
  if(!odds) return '';
  const h = odds.home, d = odds.draw, a = odds.away;
  if(h == null && d == null && a == null) return '';
  const f = v => v == null ? '—' : Number(v).toFixed(2);
  return `<div class="lrow"><i>💰 赔率</i><span>主胜 ${f(h)} · 平局 ${f(d)} · 客胜 ${f(a)}</span></div>`;
}

function liveLineups(m){
  const rows = m.lineups || [];
  // 阵容未公布是**常态**（赛前 20–40 分钟才出），措辞要说清是时间问题、
  // 不是数据源故障——此前显示成「缺少 FOOTBALL_DATA_API_TOKEN」，
  // 用户据此以为数据源坏了。
  if(!rows.length) return `<div class="lrow"><i>👥 阵容</i>`
    + `<span class="dim">未公布（通常赛前 20–40 分钟才出）</span></div>`;
  let html = '';
  rows.slice(0,2).forEach(t=>{
    const nm = t.team_cn || t.team || '';
    const xi = (t.start_xi || []).slice(0,11).map(p=>esc(p.name || '')).filter(Boolean);
    html += `<div class="lxi"><b>${esc(nm)}</b>`
      + (xi.length ? `<span>${xi.join('、')}</span>`
                   : `<span class="dim">首发未公布</span>`)
      + `</div>`;
  });
  return `<div class="lrow"><i>👥 阵容</i><div class="lcol">${html}</div></div>`;
}

function liveInjuries(m){
  const rows = m.injuries || [];
  if(!rows.length) return '';
  let html = '';
  rows.slice(0,2).forEach(t=>{
    const list = (t.players || []).slice(0,6)
      .map(p => esc((p.name||'') + (p.reason ? '（' + p.reason + '）' : '')));
    if(!list.length) return;
    html += `<div class="lxi"><b>${esc(t.team_cn || t.team || '')}</b>`
      + `<span class="bad">${list.join('、')}</span></div>`;
  });
  return html ? `<div class="lrow"><i>🏥 伤停</i><div class="lcol">${html}</div></div>` : '';
}

function liveErrorRow(errors){
  const keys = Object.keys(errors || {});
  if(!keys.length) return '';
  return `<div class="lrow"><i>⚠️ 缺失</i><span class="dim">`
    + esc(keys.join('、')) + ` 未取到（不影响比分）</span></div>`;
}

function liveMatchCard(m){
  const hs = m.home_score, as_ = m.away_score;
  const score = (hs != null && as_ != null)
    ? `<b class="livescore">${m.home_score}-${m.away_score}</b>`
    : `<span class="pill2">${esc(m.status_cn || '')}</span>`;
  const el = m.elapsed != null ? `${m.elapsed}'` : '';
  const hn = esc(m.home_cn || m.home || '?');
  const an = esc(m.away_cn || m.away || '?');
  // 队名竖排判定（与今日赛程同一规则）：横排放不下就竖排，绝不截断
  const w = txt => [...txt].reduce((s,c)=> s + (c.charCodeAt(0) > 255 ? 2 : 1), 0);
  const stack = (w(hn) + w(an)) > 20 ? ' stack' : '';
  return `<div class="livem">
    <div class="lhead">
      <span class="dot"></span>
      <span class="lgemblem">${esc(m.league_flag || '⚽')}</span>
      <span class="lgname">${esc(m.league_cn || m.league || '')}</span>
      <span class="lst">🔴 ${esc(m.status_cn || '')}${el ? ' · ⏱ ' + esc(el) : ''}</span>
    </div>
    <div class="lteams${stack}">
      <span class="ltn">${hn}</span>
      ${score}
      <span class="ltn ra">${an}</span>
    </div>
    ${liveOddsRow(m.odds)}
    ${liveLineups(m)}
    ${liveInjuries(m)}
    ${liveErrorRow(m.errors)}
  </div>`;
}

function liveCard(lv, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>🔴 正在进行 <span>实时比分 · 阵容 · 伤停 · 赔率</span></h2>');
  const items = (lv && lv.items) || [];
  if(!items.length){
    // 「有进行中的比赛，但都不是本模型推送过的」必须单独成段说明。
    // 混在通用空态里，用户会一直等一个永远不会出现的板块。
    const st = (lv && lv.status) || '';
    let m = esc(lv && lv.message ? lv.message : '此刻没有正在进行的比赛。');
    if(st === 'not_predicted'){
      const total = lv.live_total != null ? lv.live_total : 0;
      return head + `<div class="empty">📭 ${m}`
        + `<div class="why">全网进行中 ${esc(String(total))} 场，`
        + `本板块只显示已生成预测（自动推送或手动点过）的比赛。</div></div>`;
    }
    if(lv && lv.stale && lv.updated_at)
      m += `（最后一次成功拉取：${esc(String(lv.updated_at).slice(11,19))} UTC）`;
    // empty 状态下把诊断信息露出来：区分「此刻确实没比赛」与
    // 「订阅不含 live 能力但 API 静默返回空」，两者处置完全不同。
    if(st === 'empty' && lv && lv.diag)
      return head + `<div class="empty">📭 ${m}<div class="why">${esc(lv.diag)}</div></div>`;
    // 失败态：主文案已改成中文，英文原文降到辅助行——
    // 一眼看到的是「该怎么办」，排查时才去看原始报错。
    if((st === 'quota_exhausted' || st === 'unsupported') && lv){
      const icon = st === 'quota_exhausted' ? '⏳' : '🔒';
      const raw = lv.error_raw
        ? `<div class="why">原始报错：${esc(String(lv.error_raw))}</div>` : '';
      return head + `<div class="empty">${icon} ${m}${raw}</div>`;
    }
    return head + `<div class="empty">${m}</div></div>`;
  }
  const n = items.length;
  // 显示的是「实际拉取时刻」而非当前时刻：数据来自 60 秒 TTL 的缓存，
  // 标成当前时间等于把旧数据伪装成刚取到的。
  const upd = lv.updated_at ? String(lv.updated_at).slice(11,19) : '';
  const stale = lv.stale
    ? ` <span class="warn">· 实时拉取失败，此为最后一次成功的快照</span>` : '';
  return head
    + `<div class="livemeta">🔴 ${n} 场进行中（仅显示已推送预测）`
    + (upd ? ` · 数据时间 ${esc(upd)} UTC` : '')
    + stale
    + `</div>`
    + items.map(liveMatchCard).join('')
    + (lv.message ? `<div class="why">${esc(lv.message)}</div>` : '')
    + `</div>`;
}

async function load(){
  $('root').innerHTML = '<div class="empty">正在加载数据…</div>';
  addDebugLog('=== 开始加载页面数据 ===');
  try{
    const [h, health, audit, strength, fx, bt, jb, lv, qt] = await Promise.all([
      get('/health').catch(() => ({status:'error', version:'?', persistent:false})),
      get('/health/model').catch(() => ({status:'empty'})),
      get('/audit?limit=50').catch(() => ({status:'empty', items:[]})),
      get('/strength').catch(() => ({status:'empty', items:[]})),
      get('/fixtures?days=' + RANGE).catch(() => ({status:'empty', date:'', total:0, leagues:[]})),
      get('/backtest').catch(() => ({status:'empty', count:0, items:[]})),
      get('/jobs').catch(() => ({status:'empty', last:{}, recent:[]})),
      // 实时赛况失败不能拖累整页：它是唯一依赖外网付费能力的端点
      get('/live').catch(() => ({status:'error', count:0, items:[], message:''})),
      // 额度是旁路信息，读不到也不该拖累整页
      get('/quota').catch(() => ({status:'empty', total:0, by_task:{}}))
    ]);
    $('ver').textContent = 'v' + (h.version || '?');
    // 页脚版本取自 /health 的真实部署版本（RAILWAY_GIT_COMMIT_SHA），
    // 不再硬编码 —— 否则改了代码却分不清线上跑的是哪一版，排查时全靠猜。
    $('build').textContent = 'BUILD-' + (h.version || '?');
    const ok = h.status === 'ok';
    $('health').className = 'pill ' + (ok ? 'ok':'bad');
    $('health').textContent = ok ? (h.persistent ? '持久卷已挂载' : '⚠️ 非持久存储') : '异常';
    if(h.warning) console.warn(h.warning);

    const fxSpan = (fx.date_to && fx.date_to !== fx.date_from)
      ? `${fx.date_from||''} ~ ${fx.date_to}` : (fx.date_from || fx.date || '');
    const calib = calibCard(health);
    $('root').innerHTML =
      section('sec-live', '🔴', '正在进行', '实时比分 · 阵容 · 伤停 · 赔率',
        liveCard(lv, true))
      + section('sec-fix', '📅', '今日赛程', fxSpan + ' · 点联赛展开',
        fixturesCard(fx, true))
      + section('sec-model', '📈', '模型表现', '只用已结算场次统计',
          statCard(health, true)
          + (calib ? '<div class="cols">' + trendCard(health) + calib + '</div>'
                   : trendCard(health))
          + levelCard(health))
      + section('sec-bt', '🧪', '历史回测结论', 'Walk-Forward · 无前视偏差',
          backtestCard(bt, true))
      + section('sec-audit', '🔍', '预测审计', '最近已结算的预测 vs 实际',
          auditCard(audit, true))
      + section('sec-team', '🏆', '球队强度榜', '模型在用的攻防强度',
          strengthCard(strength, true))
      + section('sec-jobs', '⚙️', '定时任务状态', '跑没跑 · 成功没成功',
          jobsCard(jb, true)
          + quotaCard(qt, true));
    // innerHTML 重建后折叠状态会丢失，渲染完必须重新应用一次
    Object.keys(OPEN_LG).forEach(renderLg);
    addDebugLog('✅ 页面加载成功');
  }catch(err){
    $('health').className = 'pill bad';
    $('health').textContent = '加载失败';
    addDebugLog('❌ 加载失败: ' + err.message);
    $('root').innerHTML = `<div class="card"><div class="err">加载失败：${esc(err.message)}</div>
      <div class="empty">请点击"诊断"按钮查看详细错误信息，或确认 API 服务在运行。</div>
      <button class="debug-btn" onclick="toggleDebug()">打开诊断</button></div>`;
  }
}

load();
setInterval(load, 60000);   // 每分钟自动刷新
</script>

<script>
// 独立看门狗：单独一个 <script> 块，与主脚本分开编译。
// 主脚本若存在语法错误（例如同一标识符重复声明），整个块一行都不会执行，
// 页面会永远停在静态占位「正在加载数据…」，而没有任何报错提示。
// 分开编译保证这段即使主脚本挂掉也照样运行，能给出可见的错误提示。
setTimeout(function () {
  var root = document.getElementById('root');
  if (!root) return;
  var html = root.innerHTML;
  // 已渲染出卡片 = 加载成功，不干预
  if (html.indexOf('class="card"') !== -1) return;
  if (html.indexOf('初始化中') === -1 && html.indexOf('正在加载数据') === -1) return;
  root.innerHTML = '<div class="card"><div class="err">页面脚本未执行或加载超时</div>'
    + '<div class="empty">主脚本可能被语法错误中断，或接口 15 秒内未返回。'
    + '请先点右上角「诊断」：若诊断区也无任何输出，说明脚本未运行；'
    + '若有输出，按其中的失败端点排查。</div></div>';
}, 8000);
</script>
