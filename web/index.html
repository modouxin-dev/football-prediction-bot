<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>足球预测看板</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#252a34; --text:#e6e8ee;
    --dim:#9aa3b2; --accent:#4da3ff; --good:#3ddc97; --bad:#ff6b6b;
    --warn:#ffc857;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; padding:16px; max-width:960px; margin:0 auto;
  }
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:19px;margin:0;flex:1}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--good);border-color:#245c44}
  .pill.bad{color:var(--bad);border-color:#5c2b2b}
  button{
    background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;
  }
  button:active{opacity:.7}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 span{font-size:11px;color:var(--dim);font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .stat{background:#12151b;border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat i{font-style:normal;font-size:12px;color:var(--dim)}
  .empty{color:var(--dim);font-size:13px;padding:8px 0}
  .note{background:#1d2230;border-left:3px solid var(--warn);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:#cfd6e4;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .hit{color:var(--good)} .miss{color:var(--bad)}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .bar{height:8px;border-radius:4px;background:#222833;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .lv{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .lv>i{font-style:normal;width:52px;color:var(--dim)}
  .lv>.bar{flex:1}
  .lv>b{width:96px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:14px 0 4px}
  .err{color:var(--bad);font-size:13px}
  .debug{background:#1d1f26;border:1px dashed var(--line);padding:12px;border-radius:8px;font-family:monospace;font-size:12px;color:var(--dim);margin-bottom:14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
  .debug-btn{font-size:12px;padding:4px 8px;margin-top:8px;background:var(--accent);color:#000;border:none;cursor:pointer;border-radius:4px}
  .debug-btn:hover{opacity:.8}

  /* ===== 美化覆盖 ===== */
  body{background:radial-gradient(1200px 600px at 50% -200px,#1b2536,var(--bg)) fixed}
  h1{font-size:20px;font-weight:700;letter-spacing:.3px}
  .card{box-shadow:0 6px 24px rgba(0,0,0,.25);transition:border-color .15s}
  .card:hover{border-color:#334056}
  .card h2{font-size:16px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .stat{background:linear-gradient(160deg,#1a2030,#12151b);text-align:center}
  .stat b{font-size:26px;color:var(--accent)}
  table{display:block;overflow-x:auto;white-space:nowrap}
  td,th{padding:9px 8px}
  tbody tr:nth-child(even){background:#14171e}
  tbody tr:hover{background:#1c2230}
  button{transition:background .15s}
  button:hover{background:#1f2430}
  .pill{font-weight:600}
  footer{margin-top:10px}

  /* ===== 赛程卡片：每场一张，含队伍近况 ===== */
  .rbtns{display:flex;gap:6px;margin-bottom:6px}
  .rbtn{font-size:12px;padding:4px 12px;border-radius:999px}
  .rbtn.on{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
  .lg{margin-top:12px}
  .lgh{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px}
  .lgh b{font-size:14px}
  .lgh span{font-size:12px;color:var(--dim)}
  .dsep{font-size:12px;color:var(--dim);margin:10px 0 4px;padding-left:2px}
  .match{background:#12151b;border:1px solid var(--line);border-left:3px solid var(--accent);
         border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .mhead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:6px}
  .mhead .md{font-size:13px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .mhead .sc{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;margin-left:auto}
  .mhead .st{margin-left:auto}
  .pill2{font-size:11px;padding:1px 7px;border-radius:999px;background:#1d2430;color:var(--dim)}
  .team{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
  .team .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team .tm{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .team .tm b{color:var(--accent);font-weight:600}
  .team .tm i{font-style:normal}
  .form{display:inline-flex;gap:3px}
  .form i{font-style:normal;width:18px;height:18px;line-height:18px;text-align:center;
          border-radius:4px;font-size:11px;color:#0b0e13;font-weight:700}
  .form i.w{background:var(--good)} .form i.d{background:#8b96a8} .form i.l{background:var(--bad)}
  .form.empty{font-size:11px;color:var(--dim)}
  .pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#222833;margin:8px 0 4px}
  .pbar i{display:block;height:100%}
  .pbar i.h{background:var(--accent)} .pbar i.d{background:#6b7587} .pbar i.a{background:var(--warn)}
  .plegend{display:flex;gap:10px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .plegend b{margin-left:auto;color:var(--text)}
  .fnote{font-size:12px;color:var(--dim);margin-top:10px}

  /* ===== 分区导航 ===== */
  .secnav{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;
          padding:8px 0;margin:0 0 4px;background:#0f1115;border-bottom:1px solid var(--line);
          -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .secnav::-webkit-scrollbar{display:none}
  .secnav button{flex:0 0 auto;font-size:12.5px;padding:5px 13px;border-radius:999px;color:var(--dim)}
  .secnav button.on{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}

  /* ===== 分区 ===== */
  .sec{scroll-margin-top:52px;margin-bottom:24px}
  .sechd{display:flex;align-items:center;gap:9px;margin:0 0 10px;padding-left:2px}
  .sechd::before{content:'';flex:0 0 auto;width:3px;height:15px;border-radius:2px;background:var(--accent)}
  .sechd b{font-size:14.5px;letter-spacing:.2px}
  .sechd span{font-size:11.5px;color:var(--dim);margin-left:auto;text-align:right}
  .secbody{display:flex;flex-direction:column;gap:12px}
  .secbody .card{margin-bottom:0}
  .cols{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
  @media(min-width:900px){
    .cols{grid-template-columns:1fr 1fr}
    .cols-3{grid-template-columns:1fr 1fr}
  }
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>

<header>
  <h1>⚽ 足球预测看板</h1>
  <span class="pill" id="ver">—</span>
  <span class="pill" id="health">加载中…</span>
  <button onclick="load()">刷新</button>
  <button onclick="toggleDebug()">诊断</button>
</header>

<nav class="secnav" id="secnav">
  <button data-sec="sec-fix" onclick="goSec('sec-fix')">📅 赛程</button>
  <button data-sec="sec-model" onclick="goSec('sec-model')">📈 模型表现</button>
  <button data-sec="sec-bt" onclick="goSec('sec-bt')">🧪 历史回测</button>
  <button data-sec="sec-audit" onclick="goSec('sec-audit')">🔍 预测审计</button>
  <button data-sec="sec-team" onclick="goSec('sec-team')">🏆 球队强度</button>
</nav>

<div id="debug-panel" style="display:none">
  <div class="card">
    <h2>🔧 诊断信息 <span>系统状态检查</span></h2>
    <div id="debug-info" class="debug">加载诊断信息中...</div>
    <button class="debug-btn" onclick="runDiagnostic()">运行诊断</button>
    <button class="debug-btn" onclick="toggleDebug()">关闭</button>
  </div>
</div>

<div id="root"><div class="empty">初始化中…（若持续超过 10 秒无变化，说明页面脚本未运行）</div></div>

<footer>数据来自本地 SQLite · 只读，不消耗 API 额度 · <b id="build">BUILD-</b></footer>

<script>
const $ = (id) => document.getElementById(id);
const debugLog = [];

function addDebugLog(msg) {
  debugLog.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
  console.log(msg);
}

function toggleDebug() {
  const panel = $('debug-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if(panel.style.display === 'block') {
    runDiagnostic();
  }
}

async function runDiagnostic() {
  debugLog.length = 0;
  $('debug-info').textContent = '正在诊断...';
  addDebugLog('=== 开始系统诊断 ===');
  
  // 检查基本连接
  addDebugLog('1. 检查API服务连接...');
  try {
    const health = await fetch('/health', {cache:'no-store'});
    addDebugLog(`   GET /health → ${health.status}`);
    if(health.ok) {
      const data = await health.json();
      addDebugLog(`   响应: ${JSON.stringify(data)}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  // 检查fixtures端点
  addDebugLog('\\n2. 检查赛程数据...');
  try {
    const fx = await fetch('/fixtures', {cache:'no-store'});
    addDebugLog(`   GET /fixtures → ${fx.status}`);
    if(fx.ok) {
      const data = await fx.json();
      addDebugLog(`   响应状态: ${data.status}`);
      addDebugLog(`   数据量: ${data.total} 场比赛`);
      addDebugLog(`   联赛数: ${(data.leagues||[]).length}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  // 检查health/model端点
  addDebugLog('\\n3. 检查模型健康度...');
  try {
    const model = await fetch('/health/model', {cache:'no-store'});
    addDebugLog(`   GET /health/model → ${model.status}`);
    if(model.ok) {
      const data = await model.json();
      addDebugLog(`   状态: ${data.status}`);
      addDebugLog(`   已结算: ${data.settled||0} 场`);
      addDebugLog(`   命中率: ${data.accuracy ? (data.accuracy*100).toFixed(1)+'%' : '无'}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  // 检查audit端点
  addDebugLog('\\n4. 检查预测审计...');
  try {
    const audit = await fetch('/audit?limit=5', {cache:'no-store'});
    addDebugLog(`   GET /audit → ${audit.status}`);
    if(audit.ok) {
      const data = await audit.json();
      addDebugLog(`   预测数: ${(data.items||[]).length}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  // 检查strength端点
  addDebugLog('\\n5. 检查球队强度榜...');
  try {
    const st = await fetch('/strength', {cache:'no-store'});
    addDebugLog(`   GET /strength → ${st.status}`);
    if(st.ok) {
      const data = await st.json();
      addDebugLog(`   状态: ${data.status}`);
      addDebugLog(`   球队数: ${(data.teams||[]).length}`);
    }
  } catch(err) {
    addDebugLog(`   ❌ 错误: ${err.message}`);
  }
  
  addDebugLog('\\n=== 诊断完成 ===');
  $('debug-info').textContent = debugLog.join('\\n');
}

async function get(url, timeoutMs){
  addDebugLog(`正在请求: ${url}`);
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ac ? setTimeout(() => ac.abort(), timeoutMs || 8000) : null;
  try {
    const r = await fetch(url, {cache:'no-store', signal: ac ? ac.signal : undefined});
    addDebugLog(`响应状态: ${url} → ${r.status}`);
    if(!r.ok) throw new Error(url + ' → HTTP ' + r.status);
    const data = await r.json();
    addDebugLog(`获得数据: ${url} → ${JSON.stringify(data).substring(0,100)}`);
    return data;
  } catch(err) {
    const msg = (err && err.name === 'AbortError') ? (url + ' → 超时(' + (timeoutMs||8000) + 'ms)') : (url + ' → ' + err.message);
    addDebugLog(`请求失败: ${msg}`);
    throw new Error(msg);
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function esc(s){
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- SVG 折线图：Log Loss 趋势 ---------- */
function lineChart(series, opts){
  const W = 600, H = 180, P = {l:38, r:8, t:10, b:24};
  if(!series || series.length < 2) return '<div class="empty">数据点不足，无法绘制趋势。</div>';
  const vals = series.map(p => p.v).filter(v => typeof v === 'number' && isFinite(v));
  if(!vals.length) return '<div class="empty">无有效数据。</div>';
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi - lo < 1e-9){ lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => P.l + (W-P.l-P.r) * i / (series.length - 1);
  const y = v => P.t + (H-P.t-P.b) * (1 - (v - lo) / (hi - lo));

  let grid = '', pts = '';
  for(let g=0; g<=3; g++){
    const v = lo + (hi-lo)*g/3, yy = y(v);
    grid += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#252a34" stroke-width="1"/>`
         +  `<text x="${P.l-6}" y="${yy+3.5}" fill="#9aa3b2" font-size="10" text-anchor="end">${v.toFixed(2)}</text>`;
  }
  series.forEach((p,i) => { pts += (i? ' L':'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Log Loss 趋势">
    ${grid}
    <path d="${pts}" fill="none" stroke="${opts.color}" stroke-width="2" stroke-linejoin="round"/>
    <text x="${W-P.r}" y="${H-6}" fill="#9aa3b2" font-size="10" text-anchor="end">场次数 →</text>
  </svg>`;
}

/* ---------- SVG 散点+对角线：校准曲线 ---------- */
function calibChart(buckets){
  if(!buckets || !buckets.length) return '<div class="empty">暂无校准数据。</div>';
  const W = 300, H = 300, P = 34;
  const x = v => P + (W-2*P) * v;
  const y = v => (H-P) - (H-2*P) * v;
  let g = '';
  for(let t=0; t<=1.0001; t+=0.25){
    g += `<line x1="${x(t)}" y1="${P-8}" x2="${x(t)}" y2="${H-P}" stroke="#1e222b"/>`
      +  `<line x1="${P-8}" y1="${y(t)}" x2="${W-P}" y2="${y(t)}" stroke="#1e222b"/>`
      +  `<text x="${x(t)}" y="${H-P+14}" fill="#9aa3b2" font-size="9.5" text-anchor="middle">${t.toFixed(2)}</text>`
      +  `<text x="${P-11}" y="${y(t)+3.5}" fill="#9aa3b2" font-size="9.5" text-anchor="end">${t.toFixed(2)}</text>`;
  }
  let dots = '';
  buckets.forEach(b => {
    const r = 3 + Math.min(9, Math.sqrt(b.n) * 1.4);   // 点的大小表示样本量
    dots += `<circle cx="${x(b.predicted).toFixed(1)}" cy="${y(b.observed).toFixed(1)}" r="${r.toFixed(1)}"
      fill="#4da3ff" fill-opacity="0.55" stroke="#4da3ff" stroke-width="1.2"><title>${esc(b.range)} · n=${b.n}</title></circle>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="校准曲线">
    ${g}
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="#3ddc97" stroke-width="1.4" stroke-dasharray="5 4"/>
    ${dots}
    <text x="${W/2}" y="${H-4}" fill="#9aa3b2" font-size="10" text-anchor="middle">模型预测的概率</text>
    <text transform="translate(11 ${H/2}) rotate(-90)" fill="#9aa3b2" font-size="10" text-anchor="middle">实际发生频率</text>
  </svg>
  <div style="font-size:12px;color:var(--dim);margin-top:2px">绿色虚线 = 完美校准；点越贴近它越好，圆越大表示该区间样本越多。</div>`;
}

/* ---------- 分区容器 ----------
   看板内容按「赛程 / 模型表现 / 回测 / 审计 / 强度」分组，
   每组一个标题条 + 吸顶导航，避免十几张卡片平铺到底找不着重点。 */
function section(id, icon, title, note, inner){
  return `<section class="sec" id="${id}">`
    + `<div class="sechd"><b>${icon} ${title}</b>${note ? `<span>${esc(note)}</span>` : ''}</div>`
    + `<div class="secbody">${inner}</div></section>`;
}

function goSec(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'start'});
  const btns = document.querySelectorAll('.secnav button');
  for(let i=0;i<btns.length;i++){
    btns[i].className = (btns[i].getAttribute('data-sec') === id) ? 'on' : '';
  }
}

/* ---------- 渲染 ---------- */
const LV = {high:'🟢 高', medium:'🟡 中', low:'🔴 低', unknown:'未知'};

function statCard(health, noHead){
  const acc = health.accuracy == null ? '—' : (health.accuracy*100).toFixed(1)+'%';
  const ll  = health.mean_log_loss == null ? '—' : health.mean_log_loss.toFixed(4);
  const ece = health.ece == null ? '—' : health.ece.toFixed(4);
  return `<div class="card">` + (noHead ? '' : '<h2>关键指标</h2>') + `<div class="grid">
    <div class="stat"><b>${health.settled ?? 0}</b><i>已结算场次</i></div>
    <div class="stat"><b>${acc}</b><i>命中率</i></div>
    <div class="stat"><b>${ll}</b><i>平均 Log Loss ↓</i></div>
    <div class="stat"><b>${ece}</b><i>校准误差 ECE ↓</i></div>
  </div></div>`;
}

function trendCard(health){
  if(health.status === 'empty') return `<div class="card"><h2>模型健康度</h2><div class="empty">${esc(health.message)}</div></div>`;
  const series = (health.trend||[]).map(p => ({v:p.log_loss}));
  return `<div class="card">
    <h2>模型健康度 <span>累积平均 Log Loss</span></h2>
    ${health.message ? `<div class="note">${esc(health.message)}</div>`:''}
    ${lineChart(series,{color:'#4da3ff'})}
  </div>`;
}

function calibCard(health){
  if(health.status === 'empty') return '';
  return `<div class="card">
    <h2>校准曲线 <span>说的 vs 发生的</span></h2>
    ${calibChart(health.calibration)}
  </div>`;
}

function levelCard(health){
  const lv = health.by_level || {};
  const keys = Object.keys(lv);
  if(!keys.length) return '';
  let rows = '';
  ['high','medium','low','unknown'].filter(k=>lv[k]).forEach(k=>{
    const s = lv[k], rate = s.rate ?? 0;
    rows += `<div class="lv"><i>${LV[k]||k}</i><div class="bar"><i style="width:${(rate*100).toFixed(1)}%"></i></div>
      <b>${(rate*100).toFixed(1)}% · ${s.hit}/${s.total}</b></div>`;
  });
  return `<div class="card"><h2>信心等级命中率 <span>高信心应高于低信心</span></h2>${rows}</div>`;
}

function strengthCard(st, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>球队强度榜 <span>模型在用的攻防强度</span></h2>');
  if(st.status === 'insufficient' || st.status === 'error')
    return head + `<div class="empty">${esc(st.message || '暂不可用')}</div></div>`;
  const teams = st.teams || [];
  if(!teams.length) return head + `<div class="empty">暂无数据。</div></div>`;
  let rows = '';
  teams.slice(0,20).forEach((t,i)=>{
    rows += `<tr><td class="num">${i+1}</td><td>${esc(t.name_cn || t.name)}</td>
      <td class="num">${t.played}</td><td class="num">${t.attack.toFixed(2)}</td>
      <td class="num">${t.defense.toFixed(2)}</td><td class="num"><b>${t.overall.toFixed(2)}</b></td></tr>`;
  });
  return head + `<table>
    <thead><tr><th>#</th><th>球队</th><th class="num">场次</th><th class="num">进攻</th><th class="num">防守</th><th class="num">综合</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div style="font-size:12px;color:var(--dim);margin-top:8px">进攻越大越强；防守越大表示失球越多（越差）。综合 = 进攻 − 防守。</div>
  </div>`;
}

function backtestCard(bt, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>历史回测结论 <span>Walk-Forward · 只用赛前数据，无前视偏差</span></h2>');
  if(!bt || bt.status === 'empty' || !bt.count){
    return head + `<div class="empty">${esc(bt && bt.message ? bt.message : '尚无回测记录。')}</div></div>`;
  }
  const rows = (bt.items||[]).map(r => {
    const acc  = r.accuracy  == null ? '—' : (r.accuracy*100).toFixed(2)+'%';
    const ll   = r.log_loss  == null ? '—' : Number(r.log_loss).toFixed(4);
    const rps  = r.rps       == null ? '—' : Number(r.rps).toFixed(4);
    const dbc  = r.corpus_db ?? 0, cvc = r.corpus_csv ?? 0;
    return `<tr><td>${esc(String(r.created_at||'').slice(0,16).replace('T',' '))}</td>`
      + `<td>${esc(r.variant||'')}</td><td class="num">${r.n ?? 0}</td>`
      + `<td class="num">${acc}</td><td class="num">${ll}</td><td class="num">${rps}</td>`
      + `<td class="num">${dbc}/${cvc}</td><td>${esc(r.verdict||'')}</td></tr>`;
  }).join('');
  return head + `<table><thead><tr><th>时间</th><th>口径</th><th class="num">场次</th>`
    + `<th class="num">命中率</th><th class="num">Log Loss</th><th class="num">RPS</th>`
    + `<th class="num">库内/语料</th><th>判定</th></tr></thead><tbody>${rows}</tbody></table>`
    + `<div style="font-size:12px;color:var(--dim);margin-top:8px">`
    + `共 ${bt.count} 条记录 · 「库内/语料」说明结论基于多少真实赛果，库内越多越贴近线上`
    + `</div></div>`;
}

function auditCard(a, noHead){
  const head = `<div class="card">`
    + (noHead ? '' : '<h2>预测审计 <span>预测 vs 实际</span></h2>');
  const items = a.items || [];
  if(!items.length) return head + `<div class="empty">暂无已结算的预测。</div></div>`;
  let rows = '';
  items.slice(0,30).forEach(it=>{
    rows += `<tr>
      <td>${esc(it.kickoff||'').slice(0,10)}</td>
      <td>${esc(it.home_cn || it.home)} vs ${esc(it.away_cn || it.away)}</td>
      <td>${esc(it.predicted)}</td>
      <td class="num">${esc(it.score)}</td>
      <td class="${it.hit?'hit':'miss'}">${it.hit?'✓':'✗'}</td></tr>`;
  });
  return head + `<table>
    <thead><tr><th>日期</th><th>比赛</th><th>预测</th><th class="num">比分</th><th>结果</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- 今日赛程：与 Telegram 推送同源 ---------- */
const ST = {NS:'未开始', TBD:'待定', FT:'完场', AET:'加时', PEN:'点球',
            '1H':'上半场', '2H':'下半场', HT:'中场', LIVE:'进行中',
            PST:'推迟', CANC:'取消', ABD:'中断', SUSP:'暂停', INT:'待续'};

function hhmm(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(11,16);
  return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Shanghai'});
}

/* 赛程范围：1=今天，3/7=含今天在内的未来几天。
   联赛并非每天都有比赛，只看「今天」时整页空白容易被当成看板坏了。 */
let RANGE = 1;
function setRange(n){ RANGE = n; load(); }

function formDots(form){
  if(!form || !form.length) return '<span class="form empty">暂无</span>';
  let h = '<span class="form">';
  form.forEach(f=>{
    const c = f.r === 'W' ? 'w' : (f.r === 'D' ? 'd' : 'l');
    const zh = f.r === 'W' ? '胜' : (f.r === 'D' ? '平' : '负');
    const tip = `${f.date} ${f.home ? '主' : '客'}对${f.opp} ${f.gf}-${f.ga}`;
    h += `<i class="${c}" title="${esc(tip)}">${zh}</i>`;
  });
  return h + '</span>';
}

function teamRow(t, name){
  t = t || {};
  // 缺数据一律显示「—」：把 null 当成 0 会让一支没回填的队看起来极弱。
  const rating = t.rating != null ? String(t.rating) : '—';
  const rank = t.rank != null ? `#${t.rank}` : '';
  const rec = (t.w != null) ? `${t.w}胜${t.d}平${t.l}负` : '';
  const gl = (t.gf != null) ? `进${t.gf}失${t.ga}` : '';
  return `<div class="team">
    <span class="tn">${esc(name)}</span>
    <span class="tm">${rank} <b>${rating}</b> <i>${esc(rec)} ${esc(gl)}</i></span>
    ${formDots(t.form)}</div>`;
}

function matchCard(m){
  const done = m.status === 'FT' || m.status === 'AET' || m.status === 'PEN';
  const score = done && m.home_score != null && m.away_score != null
    ? `<b class="sc">${m.home_score}-${m.away_score}</b>`
    : `<span class="st">${esc(ST[m.status] || m.status || '')}</span>`;
  const md = m.matchday != null ? `<span class="pill2">第${esc(String(m.matchday))}轮</span>` : '';
  const p = m.prediction;
  // 「还没算」必须区别于「算出来是 0」：p 为 null 表示未生成预测，不画假概率条。
  let bar = '<div class="form empty" style="margin-top:6px">尚未生成预测</div>';
  if(p){
    const h = (p.home_prob||0)*100, d = (p.draw_prob||0)*100, a = (p.away_prob||0)*100;
    bar = `<div class="pbar"><i class="h" style="width:${h.toFixed(1)}%"></i>`
        + `<i class="d" style="width:${d.toFixed(1)}%"></i>`
        + `<i class="a" style="width:${a.toFixed(1)}%"></i></div>`
        + `<div class="plegend"><span>主 ${h.toFixed(0)}%</span><span>平 ${d.toFixed(0)}%</span>`
        + `<span>客 ${a.toFixed(0)}%</span><b>${esc(p.result||'')}</b></div>`;
  }
  return `<div class="match">
    <div class="mhead"><span class="md">${hhmm(m.kickoff)}</span>${md}${score}</div>
    ${teamRow(m.home_team, m.home_cn || m.home)}
    ${teamRow(m.away_team, m.away_cn || m.away)}
    ${bar}</div>`;
}

function fixturesCard(fx, noHead){
  const btns = [1,3,7].map(n=>
    `<button class="rbtn${RANGE===n?' on':''}" onclick="setRange(${n})">${n===1?'今天':(n===3?'3 天':'7 天')}</button>`
  ).join('');
  const span = fx.date_to && fx.date_to !== fx.date_from
    ? `${esc(fx.date_from||'')} ~ ${esc(fx.date_to)}` : esc(fx.date_from || fx.date || '');
  const head = `<div class="card">`
    + (noHead ? '' : `<h2>赛程与队伍状态 <span>${span} · 与 Telegram 同源</span></h2>`)
    + `<div class="rbtns">${btns}</div>`;
  const leagues = fx.leagues || [];
  if(!leagues.length){
    return head + `<div class="empty">${esc(fx.message || '区间内没有比赛。')}</div></div>`;
  }
  let html = '';
  leagues.forEach(g=>{
    const byDate = {};
    (g.matches||[]).forEach(m=>{
      const d = m.date || '';
      (byDate[d] = byDate[d] || []).push(m);
    });
    let inner = '';
    Object.keys(byDate).sort().forEach(d=>{
      inner += `<div class="dsep">${esc(d)}</div>` + byDate[d].map(matchCard).join('');
    });
    html += `<div class="lg"><div class="lgh"><b>${esc(g.competition_cn || g.competition || '未知联赛')}</b>`
      + `<span>${g.count} 场</span></div>${inner}</div>`;
  });
  return head + html
    + `<div class="fnote">共 ${fx.total} 场 · 近 5 场战绩只统计区间起始日之前的比赛（不含未开踢场次）`
    + ` · 实力分为当前 Elo · 时间为北京时间 · 仅供参考，不构成投注建议</div></div>`;
}

async function load(){
  $('root').innerHTML = '<div class="empty">正在加载数据…</div>';
  addDebugLog('=== 开始加载页面数据 ===');
  try{
    const [h, health, audit, strength, fx, bt] = await Promise.all([
      get('/health').catch(() => ({status:'error', version:'?', persistent:false})),
      get('/health/model').catch(() => ({status:'empty'})),
      get('/audit?limit=50').catch(() => ({status:'empty', items:[]})),
      get('/strength').catch(() => ({status:'empty', items:[]})),
      get('/fixtures?days=' + RANGE).catch(() => ({status:'empty', date:'', total:0, leagues:[]})),
      get('/backtest').catch(() => ({status:'empty', count:0, items:[]}))
    ]);
    $('ver').textContent = 'v' + (h.version || '?');
    // 页脚版本取自 /health 的真实部署版本（RAILWAY_GIT_COMMIT_SHA），
    // 不再硬编码 —— 否则改了代码却分不清线上跑的是哪一版，排查时全靠猜。
    $('build').textContent = 'BUILD-' + (h.version || '?');
    const ok = h.status === 'ok';
    $('health').className = 'pill ' + (ok ? 'ok':'bad');
    $('health').textContent = ok ? (h.persistent ? '持久卷已挂载' : '⚠️ 非持久存储') : '异常';
    if(h.warning) console.warn(h.warning);

    const fxSpan = (fx.date_to && fx.date_to !== fx.date_from)
      ? `${fx.date_from||''} ~ ${fx.date_to}` : (fx.date_from || fx.date || '');
    const calib = calibCard(health);
    $('root').innerHTML =
      section('sec-fix', '📅', '赛程与队伍状态', fxSpan + ' · 与 Telegram 同源',
        fixturesCard(fx, true))
      + section('sec-model', '📈', '模型表现', '只用已结算场次统计',
          statCard(health, true)
          + (calib ? '<div class="cols">' + trendCard(health) + calib + '</div>'
                   : trendCard(health))
          + levelCard(health))
      + section('sec-bt', '🧪', '历史回测结论', 'Walk-Forward · 无前视偏差',
          backtestCard(bt, true))
      + section('sec-audit', '🔍', '预测审计', '最近已结算的预测 vs 实际',
          auditCard(audit, true))
      + section('sec-team', '🏆', '球队强度榜', '模型在用的攻防强度',
          strengthCard(strength, true));
    addDebugLog('✅ 页面加载成功');
  }catch(err){
    $('health').className = 'pill bad';
    $('health').textContent = '加载失败';
    addDebugLog('❌ 加载失败: ' + err.message);
    $('root').innerHTML = `<div class="card"><div class="err">加载失败：${esc(err.message)}</div>
      <div class="empty">请点击"诊断"按钮查看详细错误信息，或确认 API 服务在运行。</div>
      <button class="debug-btn" onclick="toggleDebug()">打开诊断</button></div>`;
  }
}

load();
setInterval(load, 60000);   // 每分钟自动刷新
</script>

<script>
// 独立看门狗：单独一个 <script> 块，与主脚本分开编译。
// 主脚本若存在语法错误（例如同一标识符重复声明），整个块一行都不会执行，
// 页面会永远停在静态占位「正在加载数据…」，而没有任何报错提示。
// 分开编译保证这段即使主脚本挂掉也照样运行，能给出可见的错误提示。
setTimeout(function () {
  var root = document.getElementById('root');
  if (!root) return;
  var html = root.innerHTML;
  // 已渲染出卡片 = 加载成功，不干预
  if (html.indexOf('class="card"') !== -1) return;
  if (html.indexOf('初始化中') === -1 && html.indexOf('正在加载数据') === -1) return;
  root.innerHTML = '<div class="card"><div class="err">页面脚本未执行或加载超时</div>'
    + '<div class="empty">主脚本可能被语法错误中断，或接口 15 秒内未返回。'
    + '请先点右上角「诊断」：若诊断区也无任何输出，说明脚本未运行；'
    + '若有输出，按其中的失败端点排查。</div></div>';
}, 8000);
</script>
</body>
