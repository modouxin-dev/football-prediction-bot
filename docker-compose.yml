# 自托管部署（Oracle Cloud 免费 ARM / 任意 VPS）用的编排文件。
#
# 适用：任何装了 Docker 的机器，不依赖特定云厂商，也不依赖 Railway。
# 用法：把 .env.example 复制成 .env 填好，然后 docker compose up -d
#
# 注意：这是长轮询的常驻 worker，不监听端口，所以没有 ports 映射。
#
# 数据持久化（预测历史 / 回评命中率，重启与重建容器都不清零）：
#   宿主机 ./data  ←→  容器 /data
#   内含 football.db（含 -wal / -shm）、backups/、cache/、charts/、exports/
#   用的是 bind mount，因此 `docker compose down` 不会删除数据；
#   只有手动删掉宿主机的 ./data 目录才会丢失。
services:
  bot:
    build: .
    image: football-prediction-bot:latest
    container_name: football-prediction-bot
    # 容器退出后自动拉起（含宿主重启），保证 24/7 在线
    restart: unless-stopped
    env_file:
      - .env
    # 与容器内非 root 用户的 uid 保持一致，避免挂载卷权限问题
    user: "10001:10001"
    volumes:
      # SQLite 数据库与图表缓存落盘：重部署/重启不丢预测历史与命中率统计。
      # 必须挂载整个目录而不是单个 db 文件——数据库是 WAL 模式，
      # football.db-wal / football.db-shm 需要与主库一起持久化，
      # 否则可能丢失最近一次尚未合并的写入。
      - ./data:/data
    # 日志滚动，避免长期运行把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查：数据库文件存在即视为存活
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/football.db || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 60s

  # 每日数据库热备份：用 sqlite3 一致性快照，避免 WAL 中间态。
  # 备份落在 ./data/backups（同样持久化），保留最近 14 份。
  # 不需要备份的话，启动时加 --profile backup 才会跑，默认不影响主服务：
  #   docker compose --profile backup up -d
  backup:
    image: football-prediction-bot:latest
    container_name: football-prediction-bot-backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /app/backup_db.sh /data/backups
          # 每 24 小时一次
          sleep 86400
        done
    user: "10001:10001"
    volumes:
      - ./data:/data
    restart: unless-stopped
    # 默认不启动；需要时用 --profile backup 启用
    profiles: ["backup"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
